name: Signaler un bug
description: Quelque chose ne marche pas dans l'app
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Que s'est-il passé ?
      description: Décris le problème et ce que tu attendais.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Comment le reproduire ?
      description: Les étapes, l'onglet, la leçon ou le thème concerné.
  - type: input
    id: context
    attributes:
      label: Contexte (rempli par l'app)
      description: Version, mode d'utilisation et appareil. Tu peux le modifier ou l'effacer.
