}

/* ===== Onglet Collection : un tableau de tous les caractères =====
   Sombre : pas encore appris. Jade : niveau 2 du thème validé et aucune erreur en cours sur un mot qui le contient.
   À corriger : appris, mais une erreur reste dans la liste de révision. Or : jade + tracé de mémoire maîtrisé. */
const LEARN_LV=1; // index du niveau qui rend un caractère « appris » (niveau 2, Reconnaissance)
let _ct=null,_cc=null;
function charWords(){
  if(_ct)return _ct;_ct=new Map();
  V.forEach(v=>{if(v.t!=="w")return;const z=v.zh[0];if(!HAN_RE.test(z))return;[...new Set([...z])].forEach(c=>{if(!_ct.has(c))_ct.set(c,[]);_ct.get(c).push(v)})});
  return _ct;
}
const charLearned=c=>(charWords().get(c)||[]).some(v=>lvOk(v.th,LEARN_LV));
const charFix=c=>(charWords().get(c)||[]).some(v=>state.errors[v.id]);
function charState(c){if(!charLearned(c))return"n";if(charFix(c))return"f";return wrSt(c)==="m"?"g":"j"}
const CS_LABEL={n:"pas encore appris",f:"à corriger",j:"appris",g:"or"};
function collChars(){
  if(_cc)return _cc;const seen=new Set();
  _cc=LESSONS.map(l=>{const items=[];wrWords(l).forEach(w=>w.chars.forEach(c=>{if(!seen.has(c)){seen.add(c);items.push({c,l,w})}}));return {l,items}}).filter(g=>g.items.length);
  return _cc;
}
function collStats(){
  const o={n:0,f:0,j:0,g:0,t:0};
  collChars().forEach(g=>g.items.forEach(it=>{o.t++;o[charState(it.c)]++}));
  return o;
}
function renderCollection(){
  screen="collection";closeSheet();
  const st=collStats(),groups=collChars(),pc=k=>st.t?st[k]/st.t*100:0;
  const words=V.filter(v=>v.t==="w"&&lvOk(v.th,LEARN_LV)).length;
  let h=`<div class="tabscr"><main class="page">
    <header class="phead"><div class="seal" aria-hidden="true">字</div><div><h1>Collection</h1><p>Attrapez les tous</p></div>${flameBtn()}</header>
    <section class="card cstats" aria-label="Progression de la collection">
      <div class="cbar" role="img" aria-label="${st.g} en or, ${st.j} en jade, ${st.f} à corriger, ${st.n} pas encore appris"><i class="g" style="width:${pc("g")}%"></i><i class="j" style="width:${pc("j")}%"></i><i class="f" style="width:${pc("f")}%"></i></div>
      <div class="ccount"><div><b class="g">${st.g}</b><span>or</span></div><div><b class="j">${st.j}</b><span>jade</span></div><div><b>${st.f}</b><span>à corriger</span></div><div><b>${st.n}</b><span>sombres</span></div></div></section>`;
  if(!wrOk()) h+=`<p class="dashed">Le module de tracé n'a pas pu se charger. Recharge la page.</p>`;
  h+=`<button class="btn" id="cseries" ${wrOk()?"":"disabled"}>Lancer une série d'écriture</button>`;
  groups.forEach(g=>{
    const tot=g.items.length,gg=g.items.filter(it=>charState(it.c)==="g").length,jj=g.items.filter(it=>charState(it.c)==="j").length;
    h+=`<section class="card cgroup" aria-label="${esc(g.l.n)}, ${esc(g.l.t)}"><div class="chead"><span class="tx"><span class="eyebrow">${esc(g.l.n)}</span><b>${esc(g.l.t)}</b></span><span class="sc">${gg} or · ${jj} jade · ${tot}</span></div>
      <div class="cgrid">${g.items.map(it=>{const k=charState(it.c);return `<button class="ctile ${k}" data-c="${esc(it.c)}" aria-label="${esc(it.c)}, ${CS_LABEL[k]}"><span lang="zh">${esc(it.c)}</span></button>`}).join("")}</div>
      <button class="btn sec sm" data-wl="${g.l.id}">Écriture de la leçon</button></section>`;
  });
  h+=`<p class="note-p">Tracé et ordre des traits : Hanzi Writer et les données Make Me a Hanzi.</p></main></div>${navHTML("collection")}`;
  app.innerHTML=h;bindNav();bindFlame();
  document.getElementById("cseries").onclick=()=>startWRun(newWRun(null));
  app.querySelectorAll(".ctile").forEach(b=>b.onclick=()=>charSheet(b.dataset.c));
  app.querySelectorAll("[data-wl]").forEach(b=>b.onclick=()=>renderWLesson(LESSONS.find(l=>l.id===b.dataset.wl)));
}
function charSheet(c){
  const it=collChars().flatMap(g=>g.items).find(x=>x.c===c);if(!it)return;
  const k=charState(c),vs=charWords().get(c)||[],th=vs[0]?vs[0].th:"",rec=wrRec(c)||{ok:0},fixes=vs.filter(v=>state.errors[v.id]);
  const msg={
    n:`Pas encore appris. Valide le niveau 2 du thème « ${th} » pour le passer en jade.`,
    f:`À corriger : ${fixes.map(v=>v.py[0]).slice(0,3).join(", ")} reste dans ta liste d'erreurs. Corrige-le dans Révision pour retrouver ${wrSt(c)==="m"?"l'or":"le jade"}.`,
    j:`Appris. Trace-le de mémoire 2 fois sans faute pour le passer en or (${Math.min(rec.ok,WR_MASTER)} / ${WR_MASTER}).`,
    g:"En or : appris dans le parcours et tracé de mémoire."}[k];
  openSheet(`<div class="sh-head"><div><span class="eyebrow">${esc(it.l.n)}, ${esc(it.l.t)}</span><h2>${CS_LABEL[k].charAt(0).toUpperCase()+CS_LABEL[k].slice(1)}</h2></div><button class="xbtn" data-close aria-label="Fermer">${I.x(20)}</button></div>
    <span class="csheet-ch ${k}" lang="zh">${esc(c)}</span>
    <div class="cinfo"><b lang="zh-Latn-pinyin">${esc(it.w.py)}</b><span>${esc(it.w.fr)}</span><span>${esc(msg)}</span></div>
    <div class="stack8"><button class="btn" id="cs-go" ${wrOk()?"":"disabled"}>Tracer ce mot</button>${k==="f"?`<button class="btn sec" id="cs-rev">Corriger dans Révision</button>`:""}</div>`,
    "Détail du caractère "+c,ov=>{
      ov.querySelector("#cs-go").onclick=()=>{closeSheet();startWRun(newWRun(it.l,it.w.chars))};
      const rv=ov.querySelector("#cs-rev");if(rv)rv.onclick=()=>go("revision");
    });
}

/* ===== Mots d'une leçon ===== */
let wFilter="all";
function renderWLesson(l,keepScroll){
  screen="wlesson";closeSheet();
  const words=wrWords(l),cs=wrChars(l),m=wrMastered(l);
  const n=Math.min(WR_SERIES,cs.length);
  const cnt={all:words.length,todo:words.filter(w=>wrWordState(w)!=="m").length,done:words.filter(w=>wrWordState(w)==="m").length};
  const list=words.filter(w=>wFilter==="all"||(wFilter==="done")===(wrWordState(w)==="m"));
  const tab=(k,lab)=>`<button role="tab" class="wtab" data-f="${k}" aria-selected="${wFilter===k}">${lab} (${cnt[k]})</button>`;
  app.innerHTML=`<div class="tabscr"><main class="page wlpage">
    <div class="wlhead"><button class="xlink" id="wback" aria-label="Retour à Écriture">${I.back()}</button>
      <div><span class="eyebrow">Écriture, ${esc(lower(l.n))}</span><h1>${esc(l.t)}</h1></div></div>
    <section class="card wprog" aria-label="Progression et série">
      <div class="top"><span>Caractères maîtrisés</span><b>${m} / ${cs.length}</b></div>
      <div class="bar"><i style="width:${cs.length?m/cs.length*100:0}%"></i></div>
      <button class="btn md" id="wgo" ${n&&wrOk()?"":"disabled"}>Lancer une série de ${n}</button>
      <small>Priorité aux caractères pas encore maîtrisés</small></section>
    <div class="wtabs" role="tablist" aria-label="Filtrer">${tab("all","Tous")}${tab("todo","À travailler")}${tab("done","Maîtrisés")}</div>
    ${list.length?`<ul class="card wlist">${list.map(w=>{const st=wrWordState(w);
      return `<li><button class="wrow" data-w="${esc(w.zh)}"${wrOk()?"":" disabled"}><span class="wchips">${w.chars.map(c=>chip(c,wrSt(c),"lg")).join("")}</span>
        <span class="tx"><b lang="zh-Latn-pinyin">${esc(w.py)}</b><small>${esc(w.fr)}</small></span><span class="st">${wrStLabel[st]}</span></button></li>`}).join("")}</ul>`
      :`<p class="dashed">${wFilter==="done"?"Aucun mot maîtrisé pour l'instant.":"Tout est maîtrisé dans cette leçon."}</p>`}
  </main></div>${navHTML("collection")}`;
  bindNav();
  document.getElementById("wback").onclick=()=>{wFilter="all";go("collection")};
  document.getElementById("wgo").onclick=()=>startWRun(newWRun(l));
  app.querySelectorAll(".wtab").forEach(b=>b.onclick=()=>{wFilter=b.dataset.f;renderWLesson(l,true)});
  app.querySelectorAll(".wrow").forEach(b=>b.onclick=()=>{const w=words.find(x=>x.zh===b.dataset.w);startWRun(newWRun(l,w.chars))});
  if(!keepScroll)window.scrollTo(0,0);
}

/* ===== Série ===== */
function newWRun(l,only){
  let chars;
  if(only)chars=only.slice();
  else{const cs=l?wrChars(l):collChars().flatMap(g=>g.items.map(it=>it.c));
    const pr=c=>{const k=charState(c);return k==="j"?(wrSt(c)==="c"?0:1):k==="f"?2:k==="n"?3:4};
    chars=shuffle(cs.slice()).sort((x,y)=>pr(x)-pr(y)).slice(0,WR_SERIES)}
  return {lid:l?l.id:null,chars,idx:0,step:null,res:[]};
}
let WRN=null,WS=null; // WRN : série en cours ; WS : état de l'écran (writer, compteurs)
function startWRun(r){
  if(!r||!r.chars||!r.chars.length)return;
  WRN=r;state.wrun=r;save();
  if(WRN.idx>=WRN.chars.length){finishWRun();return}
  if(WRN.step==null)WRN.step=firstStep(WRN.chars[WRN.idx]);
  renderWQ();
}
const firstStep=c=>{const s=wrSt(c);return s==="m"?2:s==="c"?1:0};
function quitWRun(){state.wrun=WRN;save();const l=LESSONS.find(x=>x.id===WRN.lid);WRN=null;stopWriter();if(l)renderWLesson(l);else go("collection")}
/* Mot d'un caractère : dans la leçon de la série, ou dans la collection pour une série globale */
function wrWordForRun(r,c){const l=r.lid&&LESSONS.find(x=>x.id===r.lid);if(l)return wrWordOf(l,c);const it=collChars().flatMap(g=>g.items).find(x=>x.c===c);return it?it.w:null}
function stopWriter(){if(WS&&WS.writer){try{WS.writer.cancelQuiz()}catch(e){}try{WS.writer.pauseAnimation()}catch(e){}}WS=null}

function tokens(){const cs=getComputedStyle(document.documentElement),g=k=>cs.getPropertyValue(k).trim();
  return {ink:g("--ink"),jade:g("--jade"),muted:g("--muted"),line:g("--line"),outline:g("--w-outline")||g("--line"),bad:g("--bad"),half:g("--half"),hint:g("--w-hint")||g("--half")}}
function dirText(med){
  // sens d'un trait à partir de sa ligne médiane (repère des données : y vers le haut, 0 à 1024)
  const a=med[0],b=med[med.length-1],dx=b[0]-a[0],dy=a[1]-b[1];
  const zone=(a[1]>600?"en haut":a[1]<300?"en bas":"au milieu")+(a[0]<380?" à gauche":a[0]>640?" à droite":"");
  let d;const ax=Math.abs(dx),ay=Math.abs(dy);
  if(ax>ay*2)d=dx>0?"va vers la droite":"va vers la gauche";
  else if(ay>ax*2)d=dy>0?"descends":"monte";
  else d=(dy>0?"descends ":"monte ")+(dx>0?"vers la droite":"vers la gauche");
  return `Commence ${zone} et ${d}.`;
}

function renderWQ(){
  stopWriter();screen="wq";closeSheet();
  const c=WRN.chars[WRN.idx],w=wrWordForRun(WRN,c)||{chars:[c],py:"",fr:"",word:c,zh:c};
  const data=window.HANZI_DATA&&window.HANZI_DATA[c];
  if(!wrOk()||!data){app.innerHTML=`<div class="ex"><div class="extop"><button class="xlink" id="wq-x" aria-label="Quitter la série">${I.x()}</button></div><p class="dashed">Le tracé de ${esc(c)} n'a pas pu se charger.</p><div class="spacer"></div><button class="btn" id="wq-skip">Passer</button></div>`;
    document.getElementById("wq-x").onclick=quitWRun;document.getElementById("wq-skip").onclick=()=>{WRN.res.push({c,skip:true});WRN.idx++;WRN.step=null;startWRun(WRN)};return}
  const n=data.strokes.length,step=WRN.step,mem=step===2;
  const size=Math.min(310,Math.max(220,(app.clientWidth||360)-36));
  const stepLi=WSTEPS.map((s,i)=>i<step?`<li class="done">${I.check(14,3)}${s}</li>`:i===step?`<li class="cur" aria-current="step">${i+1}. ${s}</li>`:`<li>${i+1}. ${s}</li>`).join("");
  const wchips=w.chars.map(x=>x===c?(mem?`<span class="wchip q" aria-label="Caractère à écrire">?</span>`:chip(x,"cur","lg")):(mem?`<span class="wchip blank lg" aria-hidden="true"></span>`:chip(x,"n","lg"))).join("");
  const rad=data.radStrokes&&data.radStrokes.length&&data.radStrokes.length<n?data.radStrokes.length:0;
  const info=[`${n} ${plural(n,"trait","traits")}`];if(rad)info.push(`radical en vert, ${rad} ${plural(rad,"trait","traits")}`);
  const note=(V.find(v=>v.zh[0]===c&&v.note)||{}).note;
  let mid="",acts="",main="";
  if(step===0){
    mid=`<p class="winfo">${esc(info.join(", "))}${note?`<br>${esc(note)}`:""}</p>`;
    acts=`<div class="wacts"><button class="wbtn" id="w-replay">${I.redo(18)}Rejouer</button><button class="wbtn" id="w-next">Trait par trait${svg(18,'<path d="M9 6l6 6-6 6"/>')}</button></div>`;
    main=`<button class="btn" id="w-go">À moi de tracer</button>`;
  }else if(step===1){
    mid=`<div class="wcount"><span id="w-cnt">Trait 1 sur ${n}</span><span class="wdots" aria-hidden="true">${Array.from({length:n},(_,k)=>`<i class="${k===0?"cur":""}"></i>`).join("")}</span></div>
      <p class="winfo">Pars du point vert et suis le modèle.</p>`;
    acts=`<div class="wacts"><button class="wbtn" id="w-restart">Recommencer</button><button class="wbtn" id="w-anim">Revoir l'animation</button></div>`;
    main=`<button class="btn" id="w-go" disabled>Continuer après le dernier trait</button>`;
  }else{
    mid=`<div id="w-hint" class="whint" role="status" hidden></div>
      <div class="wmeta"><span>Erreurs : <b id="w-err">0</b></span><span id="w-cnt2">Trait 1 sur ${n}</span></div>`;
    main=`<div class="row-btns"><button class="btn sec" id="w-restart" style="width:auto;padding:0 18px">Recommencer</button><button class="btn grow" id="w-go" disabled>Continuer</button></div>`;
  }
  app.innerHTML=`<div class="ex wq">
    <div class="extop"><button class="xlink" id="wq-x" aria-label="Quitter la série">${I.x()}</button>
      <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${WRN.chars.length}" aria-valuenow="${WRN.idx}" aria-label="Progression de la série"><i style="width:${WRN.idx/WRN.chars.length*100}%"></i></div>
      <span class="cnt">${WRN.idx+1} / ${WRN.chars.length}</span></div>
    <ol class="wsteps" aria-label="Étapes">${stepLi}</ol>
    <section class="card wword" aria-label="Mot"><span class="wchips">${wchips}</span>
      <span class="tx"><b lang="zh-Latn-pinyin">${esc(w.py)}</b><small>${esc(w.fr)}</small></span>
      ${canSpeak()?`<button class="wsnd" id="w-snd" aria-label="Écouter la prononciation">${I.sound()}</button>`:""}</section>
    <div class="wpad" id="wpad" style="width:${size}px;height:${size}px" role="img" aria-label="${step===0?`Animation de l'ordre des traits de ${esc(c)}`:step===1?`Zone de tracé avec le modèle de ${esc(c)}`:"Zone de tracé vide"}">
      <span class="gx" aria-hidden="true"></span><span class="gy" aria-hidden="true"></span><span class="gd1" aria-hidden="true"></span><span class="gd2" aria-hidden="true"></span>
      <div id="wtarget"></div>${step===0?`<span class="wpill" id="w-pill">Trait 1 sur ${n}</span>`:""}
      <svg class="wdot" id="w-dot" width="${size-4}" height="${size-4}" aria-hidden="true"><circle r="9"></circle></svg></div>
    ${mid}${acts}
    <div class="spacer"></div>${main}
  </div>`;
  document.getElementById("wq-x").onclick=quitWRun;
  const snd=document.getElementById("w-snd");if(snd)snd.onclick=()=>speak(w.word||w.zh);
  const T=tokens(),pad=Math.round(size*.06);
  const opts={width:size-4,height:size-4,padding:pad,showOutline:step!==2,showCharacter:false,strokeAnimationSpeed:1,delayBetweenStrokes:400,
    strokeColor:step===0?T.jade:T.ink,radicalColor:step===0&&rad?T.ok||T.jade:null,outlineColor:T.outline,drawingColor:T.muted,highlightColor:T.hint,drawingWidth:Math.max(14,size/16),
    charDataLoader:(ch,done)=>done(window.HANZI_DATA[ch])};
  if(step===0)opts.radicalColor=getComputedStyle(document.documentElement).getPropertyValue("--ok").trim()||null;
  const writer=HanziWriter.create(document.getElementById("wtarget"),c,opts);
  WS={writer,c,n,step,mistakes:0,hint:false,done:false,size,pad,data};
  if(step===0)setupObserve();else setupQuiz();
}

/* Étape 1 : observer */
function setupObserve(){
  const {writer,n}=WS,pill=document.getElementById("w-pill");
  let k=0;
  const setPill=i=>{if(pill)pill.textContent=`Trait ${Math.min(i,n)} sur ${n}`};
  const playAll=()=>{writer.hideCharacter();k=0;let i=0;
    const one=()=>{if(!WS||WS.writer!==writer)return;if(i>=n){setPill(n);return}setPill(i+1);writer.animateStroke(i,{onComplete:()=>{i++;setTimeout(one,250)}})};one()};
  setTimeout(playAll,300);
  document.getElementById("w-replay").onclick=playAll;
  document.getElementById("w-next").onclick=()=>{try{writer.pauseAnimation()}catch(e){}
    if(k===0||k>=n){writer.hideCharacter();k=0}setPill(k+1);const i=k;k++;writer.animateStroke(i)};
  document.getElementById("w-go").onclick=()=>{WRN.step=1;state.wrun=WRN;save();renderWQ()};
}

/* Étapes 2 et 3 : tracé guidé, puis de mémoire */
function placeDot(i){
  const dot=document.getElementById("w-dot");if(!dot)return;
  const m=WS.data.medians[i];if(WS.step!==1||!m){dot.style.display="none";return}
  const t=HanziWriter.getScalingTransform(WS.size-4,WS.size-4,WS.pad);
  const x=t.x+m[0][0]*t.scale,y=(WS.size-4-t.y)-m[0][1]*t.scale; // même repère que la transformation SVG de Hanzi Writer
  const ci=dot.querySelector("circle");ci.setAttribute("cx",x);ci.setAttribute("cy",y);dot.style.display="";
}
function setupQuiz(){
  const {writer,n,step}=WS,go=document.getElementById("w-go");
  const setCnt=i=>{const t=`Trait ${Math.min(i+1,n)} sur ${n}`;const a=document.getElementById("w-cnt"),b=document.getElementById("w-cnt2");if(a)a.textContent=t;if(b)b.textContent=t;
    app.querySelectorAll(".wdots i").forEach((d,k)=>{d.className=k<i?"on":k===i?"cur":""})};
  const start=()=>{
    WS.mistakes=0;WS.hint=false;WS.done=false;go.disabled=true;
    if(step===1)go.textContent="Continuer après le dernier trait";
    const e=document.getElementById("w-err");if(e)e.textContent="0";
    const h=document.getElementById("w-hint");if(h)h.hidden=true;
    setCnt(0);placeDot(0);
    writer.quiz({showHintAfterMisses:2,highlightOnComplete:true,leniency:1.1,
      onMistake:sd=>{WS.mistakes++;const e=document.getElementById("w-err");if(e)e.textContent=WS.mistakes;
        if(step===2&&sd.mistakesOnStroke>=2){WS.hint=true;const h=document.getElementById("w-hint");if(h){h.hidden=false;
          h.innerHTML=`<b>Indice : le trait attendu s'affiche</b><span>${sd.mistakesOnStroke} essais ratés sur ce trait. ${esc(dirText(WS.data.medians[sd.strokeNum]))}</span>`}}},
      onCorrectStroke:sd=>{setCnt(sd.strokeNum+1);placeDot(sd.strokeNum+1);const h=document.getElementById("w-hint");if(h&&step===2)h.hidden=true},
      onComplete:sum=>{WS.done=true;WS.mistakes=sum.totalMistakes;go.disabled=false;if(step===1)go.textContent="Continuer";placeDot(-1);
        if(step===2){const h=document.getElementById("w-hint");if(h){h.hidden=false;h.className="whint "+(sum.totalMistakes?"half":"ok");
          h.innerHTML=sum.totalMistakes?`<b>Tracé terminé avec ${sum.totalMistakes} ${plural(sum.totalMistakes,"erreur","erreurs")}</b><span>${WS.hint?"Indice utilisé : cet essai ne compte pas pour la maîtrise.":"Cet essai ne compte pas pour la maîtrise."}</span>`
            :`<b>Sans faute</b><span>${(wrRec(WS.c)||{ok:0}).ok+1>=WR_MASTER?"Ce caractère sera maîtrisé.":"Encore un tracé sans faute pour le maîtriser."}</span>`}}}
    });
  };
  start();
  document.getElementById("w-restart").onclick=()=>{try{writer.cancelQuiz()}catch(e){}start()};
  const an=document.getElementById("w-anim");if(an)an.onclick=()=>{WRN.step=0;renderWQ()};
  go.onclick=()=>{if(!WS.done)return;
    if(step===1){WRN.step=2;state.wrun=WRN;save();renderWQ();return}
    recordWChar();};
}
function recordWChar(){
  const c=WS.c,prev=wrRec(c)||{ok:0,seen:false,n:0},wasM=prev.ok>=WR_MASTER,clean=WS.mistakes===0;
  const r={ok:clean?prev.ok+1:(wasM?prev.ok:0),seen:true,n:(prev.n||0)+1};
  state.wr=state.wr||{};state.wr[c]=r;
  WRN.res.push({c,mistakes:WS.mistakes,hint:WS.hint,clean,wasM,nowM:!wasM&&r.ok>=WR_MASTER,ok:r.ok});
  WRN.idx++;WRN.step=null;state.wrun=WRN;save();
  if(WRN.idx>=WRN.chars.length)finishWRun();else{WRN.step=firstStep(WRN.chars[WRN.idx]);renderWQ()}
}

/* ===== Fin de série ===== */
function finishWRun(){
  stopWriter();screen="wend";
  const r=WRN,l=LESSONS.find(x=>x.id===r.lid),res=r.res.filter(x=>!x.skip);
  const clean=res.filter(x=>x.clean).length,newM=res.filter(x=>x.nowM).length,newG=res.filter(x=>x.nowM&&charLearned(x.c)&&!charFix(x.c)).length;
  const sday=res.length&&clean*2>=res.length?markDay():null;
  state.wrun=null;save();WRN=null;
  const rows=res.map(x=>{const w=wrWordForRun(r,x.c)||{py:""};
    const det=x.nowM?`${x.ok}e essai sans faute`:x.clean&&x.wasM?"Déjà maîtrisé":x.clean?`Sans faute ${Math.min(x.ok,WR_MASTER)} / ${WR_MASTER}`:x.hint?"Indice utilisé":"À retracer";
    const pill=x.nowM?`<span class="wpl m">${charLearned(x.c)&&!charFix(x.c)?"Or":"Maîtrisé"}</span>`:x.clean?`<span class="wpl ok">Sans faute</span>`:`<span class="wpl err">${x.mistakes} ${plural(x.mistakes,"erreur","erreurs")}</span>`;
    return `<li>${chip(x.c,"plain","lg")}<span class="tx"><b lang="zh-Latn-pinyin">${esc(w.py)}</b><small>${esc(det)}</small></span>${pill}</li>`}).join("");
  app.innerHTML=`<div class="end">
    <div class="end-top tight"><span class="eyebrow">Écriture, ${l?esc(lower(l.n)):"collection"}</span><h1>Série terminée</h1></div>
    <div class="wstats"><div><b>${res.length}</b><span>${plural(res.length,"caractère","caractères")}</span></div><div><b class="ok">${clean}</b><span>sans faute</span></div><div class="hl"><b>+${newM}</b><span>${plural(newM,"maîtrisé","maîtrisés")}</span></div></div>
    ${newG?`<p class="nudge gold">${newG} ${plural(newG,"caractère passé","caractères passés")} en or dans ta collection.</p>`:""}${streakCard(sday)}
    ${rows?`<ul class="card wlist wres">${rows}</ul>`:""}
    <div class="spacer"></div>
    <button class="btn" id="w-again">Nouvelle série</button>${l?`<button class="btn link" id="w-back">Retour à la leçon</button>`:""}<button class="btn link" id="w-coll">${l?"Voir ma collection":"Retour à la collection"}</button></div>`;
  document.getElementById("w-again").onclick=()=>startWRun(newWRun(l));
  const wb=document.getElementById("w-back");if(wb)wb.onclick=()=>renderWLesson(l);
  document.getElementById("w-coll").onclick=()=>go("collection");
  window.scrollTo(0,0);
}

/* Hors ligne : uniquement sur le site (GitHub Pages). Dans l'artefact Claude, la page est
   dans un cadre et les service workers sont refusés, donc rien ne se passe. */
try{
  if("serviceWorker" in navigator && window.top===window && /^https:|^http:\/\/localhost/.test(location.href) && document.querySelector('link[rel="manifest"]')){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
}catch(e){}

state.exOff=[]; // le choix des sens a disparu de l'interface : les séries mélangent les deux
state.run=null;state.wrun=null; // aucune série en cours n'est conservée : fermer l'app ou quitter annule la série
restoreGen(state.run);
applyTheme();
render();
</script>

</body></html>
