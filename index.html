<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#256E5E" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#111816" media="(prefers-color-scheme: dark)"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Chinois"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="icon" type="image/svg+xml" href="icons/icon.svg"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"></head><body>
<title>Révisions chinois</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Révisions chinois : styles alignés sur la maquette Claude Design « Révisions chinois, refonte ».
   Largeur de référence 390 px, colonne centrée jusqu'à 520 px. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --ink:#18221F; --muted:#5E6C67; --line:#D3DCD8;
  --jade:#256E5E; --jade-soft:#DCEDE7; --jade-sh:#1A4F43; --on-jade:#FFFFFF; --jade-hover:#1B5246;
  --grid:#C7D3CE; --lock:#E7ECEA; --lock-sh:#C4CEC9; --lock-ic:#6B7974; --dash:#B9C6C1; --tint:#F4FAF8;
  --ok:#22744A; --ok-soft:#E0F1E7; --bad:#A93434; --bad-soft:#F6E1E1; --on-bad:#FFFFFF;
  --half:#9A6A12; --half-soft:#F6EBD3; --soft-ink:#3E4C47;
  --gold:#C99A1D; --gold-sh:#8A6410; --gold-soft:#F8EBC4; --on-gold:#2A1D00; --gold-ink:#7A5806; --tile:#3A4642; --tile-ink:#B3BFBA;
  --hd-eyebrow:#DCEDE7; --hd-track:rgba(255,255,255,.25); --hd-fill:#FFFFFF; --hd-sep:rgba(255,255,255,.3);
  --sw-off:#C7D3CE; --sw-knob-off:#FFFFFF; --sw-knob-on:#FFFFFF; --sw-dis:#E7ECEA;
  --overlay:rgba(17,24,22,.5); --seal-ink:#F2F5F3;
  --f-han:"Noto Serif SC","Noto Serif CJK SC","Songti SC","SimSun",serif;
  --f-ui:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --safe-b:max(26px,env(safe-area-inset-bottom,0px));
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#19221F; --ink:#E4ECE8; --muted:#97A6A0; --line:#2E3A36;
  --jade:#62C2A6; --jade-soft:#1E3530; --jade-sh:#3E8F7A; --on-jade:#0E1A17; --jade-hover:#8AD6BF;
  --grid:#33423D; --lock:#222C29; --lock-sh:#0B100E; --lock-ic:#8A9893; --dash:#4A5A55; --tint:#16201D;
  --ok:#6BCB91; --ok-soft:#1C3326; --bad:#EE8080; --bad-soft:#3A1F1F; --on-bad:#1A0E0E;
  --half:#E0B35A; --half-soft:#352C17; --soft-ink:#B5C3BD;
  --gold:#E3B341; --gold-sh:#8C6B16; --gold-soft:#3A3114; --on-gold:#1D1400; --gold-ink:#F0CB6A; --tile:#1B2421; --tile-ink:#7E8C86;
  --hd-eyebrow:#123A31; --hd-track:rgba(14,26,23,.2); --hd-fill:#0E1A17; --hd-sep:rgba(14,26,23,.25);
  --sw-off:#33423D; --sw-knob-off:#97A6A0; --sw-knob-on:#0E1A17; --sw-dis:#222C29;
  --overlay:rgba(0,0,0,.6); --seal-ink:#0E1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#19221F; --ink:#E4ECE8; --muted:#97A6A0; --line:#2E3A36;
  --jade:#62C2A6; --jade-soft:#1E3530; --jade-sh:#3E8F7A; --on-jade:#0E1A17; --jade-hover:#8AD6BF;
  --grid:#33423D; --lock:#222C29; --lock-sh:#0B100E; --lock-ic:#8A9893; --dash:#4A5A55; --tint:#16201D;
  --ok:#6BCB91; --ok-soft:#1C3326; --bad:#EE8080; --bad-soft:#3A1F1F; --on-bad:#1A0E0E;
  --half:#E0B35A; --half-soft:#352C17; --soft-ink:#B5C3BD;
  --gold:#E3B341; --gold-sh:#8C6B16; --gold-soft:#3A3114; --on-gold:#1D1400; --gold-ink:#F0CB6A; --tile:#1B2421; --tile-ink:#7E8C86;
  --hd-eyebrow:#123A31; --hd-track:rgba(14,26,23,.2); --hd-fill:#0E1A17; --hd-sep:rgba(14,26,23,.25);
  --sw-off:#33423D; --sw-knob-off:#97A6A0; --sw-knob-on:#0E1A17; --sw-dis:#222C29;
  --overlay:rgba(0,0,0,.6); --seal-ink:#0E1A17; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg)}
/* Le haut et le bas de l'écran (encoche, barre d'accueil) sont gérés par :root (squelette claude.ai et index.html du site). */
body{color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--jade)}
h1,h2,h3,p{margin:0}
[lang="zh"],.han{font-family:var(--f-han)}
.tab-nums{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button:focus-visible,input:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--jade);outline-offset:2px}
svg{display:block;flex-shrink:0}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Boutons ---------- */
.btn{height:56px;border:0;border-radius:14px;background:var(--jade);color:var(--on-jade);font-size:18px;font-weight:700;
  display:flex;align-items:center;justify-content:center;width:100%;text-decoration:none;padding:0 16px;text-align:center;line-height:1.15}
.btn:active{transform:translateY(1px)}
.btn.md{height:52px;font-size:17px}
.btn.sec{background:transparent;color:var(--jade);border:2px solid var(--jade)}
.btn.link{height:48px;background:transparent;color:var(--jade);font-size:16px}
.btn.ok{background:var(--ok);color:var(--on-bad)}
.btn.bad{background:var(--bad);color:var(--on-bad)}
.btn.bad-sec{background:transparent;color:var(--bad);border:1.5px solid var(--bad);width:auto;font-size:16px;flex-shrink:0}
.btn:disabled{background:var(--line);color:var(--muted);border-color:transparent;cursor:default;transform:none}
.btn.sm{height:44px;font-size:15px;border-width:1.5px}
.row-btns{display:flex;gap:10px}
.row-btns>.grow{flex:1}

/* ---------- Écrans à onglet ---------- */
.tabscr{padding-bottom:calc(110px + var(--safe-b) - 26px)}
.page{display:flex;flex-direction:column;gap:12px;padding:20px 16px 0}
.phead{display:flex;align-items:center;gap:12px;padding-bottom:4px}
.seal{width:48px;height:48px;border-radius:10px;background:var(--jade);color:var(--seal-ink);font-family:var(--f-han);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.phead h1{font-size:24px;font-weight:700;line-height:1.15}
.phead p{font-size:14px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.sec-title{margin:8px 0 0;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.h17{font-size:17px;font-weight:700}
.h19{font-size:19px;font-weight:700}

/* ---------- Barre de navigation ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line)}
.nav-in{max-width:520px;margin:0 auto;display:flex;gap:6px;padding:8px 12px var(--safe-b)}
.nav a{flex:1;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:12px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;position:relative}
.nav a[aria-current="page"]{background:var(--jade-soft);color:var(--jade);font-weight:700}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:var(--on-bad);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* ---------- Bandeau de leçon ---------- */
.lhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;padding:12px 16px 8px;background:var(--bg)}
.lband{background:var(--jade);border-radius:16px;box-shadow:0 4px 0 var(--jade-sh);display:flex;align-items:stretch;color:var(--on-jade)}
.lband-main{flex:1;padding:12px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.lband .eyebrow{color:var(--hd-eyebrow)}
.lband h1{font-size:21px;font-weight:700;line-height:1.15}
.lband-prog{display:flex;align-items:center;gap:10px}
.lband-track{flex:1;height:8px;border-radius:4px;background:var(--hd-track);overflow:hidden}
.lband-track i{display:block;height:100%;border-radius:4px;background:var(--hd-fill)}
.lband-prog span{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.lband-list{width:60px;border:0;border-left:1px solid var(--hd-sep);background:transparent;display:flex;align-items:center;justify-content:center;border-radius:0 16px 16px 0;color:var(--on-jade)}

/* ---------- Parcours ---------- */
.path{display:flex;flex-direction:column;align-items:center;padding:24px 0 0}
.path.first{padding-top:8px}
.how{width:calc(100% - 32px);padding:14px 16px;display:flex;flex-direction:column;gap:10px;margin-bottom:26px}
.how h2{font-size:18px;font-weight:700}
.how ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.how li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.35}
.num24{width:24px;height:24px;flex-shrink:0;border-radius:50%;background:var(--jade-soft);color:var(--jade);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tsep{width:100%;display:flex;align-items:center;gap:12px;padding:0 16px;margin:0 0 26px;background:none;border:0;text-align:center}
.tsep.first{margin-bottom:22px}
.tsep>i{flex:1;height:1px;background:var(--grid)}
.tsep-t{display:flex;flex-direction:column;align-items:center;max-width:62%;padding:0;border:0;background:none;color:inherit;text-align:center}
.tsep-b{width:44px;height:44px;flex-shrink:0;padding:0;border:0;border-radius:50%;background:var(--jade-soft);color:var(--jade);display:flex;align-items:center;justify-content:center}
.tsep.locked .tsep-b{background:var(--lock);color:var(--lock-ic)}
.tsep b{font-size:16px;font-weight:700;color:var(--ink);line-height:1.25}
.tsep small{font-size:13px;font-weight:600;color:var(--muted)}
.tsep small.ok{font-weight:700;color:var(--ok)}
.tsep small.part{font-weight:700;color:var(--jade)}
.tsep.locked b{color:var(--muted)}
.isl{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:22px}
.isl.last{margin-bottom:34px}
.isl.cur{gap:10px}
.isl-b{width:68px;height:68px;padding:0;border:0;border-radius:50%;background:var(--jade);box-shadow:0 6px 0 var(--jade-sh);display:flex;align-items:center;justify-content:center;color:var(--on-jade);font-size:26px;font-weight:700}
.isl-b:active{transform:translateY(3px);box-shadow:0 3px 0 var(--jade-sh)}
.isl.cur .isl-b{box-shadow:0 6px 0 var(--jade-sh),0 0 0 8px var(--jade-soft)}
.isl.cur .isl-b:active{box-shadow:0 3px 0 var(--jade-sh),0 0 0 8px var(--jade-soft)}
.isl-b.av{background:var(--surface);border:3px solid var(--jade);box-shadow:0 6px 0 var(--dash);color:var(--jade);font-size:22px}
.isl-b:disabled{background:var(--lock);box-shadow:0 6px 0 var(--lock-sh);color:var(--lock-ic);cursor:default;transform:none}
.isl-l{font-size:13px;font-weight:600;color:var(--muted)}
.isl.cur .isl-l{font-weight:700;color:var(--jade);margin-top:4px}
.bubble{position:relative;background:var(--surface);border:2px solid var(--jade);border-radius:12px;padding:6px 14px;font-size:15px;font-weight:700;color:var(--jade);margin-bottom:8px}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--jade);border-bottom:2px solid var(--jade);transform:translateX(-50%) rotate(45deg)}
.ctl{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:40px}
.ctl.cur{gap:10px}
.ctl-b{position:relative;width:88px;height:88px;padding:0;border:0;border-radius:50%;background:var(--jade);box-shadow:0 6px 0 var(--jade-sh);display:flex;align-items:center;justify-content:center;color:var(--on-jade)}
.ctl.cur .ctl-b{box-shadow:0 6px 0 var(--jade-sh),0 0 0 8px var(--jade-soft)}
.ctl-b:disabled{background:var(--lock);box-shadow:0 6px 0 var(--lock-sh);color:var(--lock-ic);cursor:default}
.ctl-badge{position:absolute;right:-4px;bottom:-4px;width:30px;height:30px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--lock-ic)}
.ctl-badge.ok{color:var(--jade);border-color:var(--jade)}
.ctl-t{display:flex;flex-direction:column;align-items:center;text-align:center}
.ctl.cur .ctl-t{margin-top:4px}
.ctl-t b{font-size:17px;font-weight:700}
.ctl-t span{font-size:14px;color:var(--muted)}
.ctl-t span.ok{color:var(--ok);font-weight:700}
.nextl{width:calc(100% - 32px);border:1.5px dashed var(--dash);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;background:none;text-align:left;color:var(--muted);margin-bottom:24px}
.nextl.open{border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.nextl .ic44{width:44px;height:44px;flex-shrink:0;border-radius:50%;background:var(--lock);display:flex;align-items:center;justify-content:center;color:var(--lock-ic)}
.nextl.open .ic44{background:var(--jade);color:var(--on-jade)}
.nextl .tx{display:flex;flex-direction:column;flex:1;min-width:0}
.nextl .tx .eyebrow{color:var(--muted)}
.nextl .tx b{font-size:16px;font-weight:700}
.nextl .tx small{font-size:13px;color:var(--muted)}

/* ---------- Feuilles (thème, leçons, sélection, confirmation) ---------- */
.ov{position:fixed;inset:0;z-index:20;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease-out}
.sheet{width:100%;max-width:520px;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 16px var(--safe-b);display:flex;flex-direction:column;gap:16px;animation:up .2s ease-out}
.sheet>*{flex-shrink:0}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center;flex-shrink:0}
.sh-head{display:flex;align-items:flex-start;gap:12px}
.sh-head>div{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.sh-head .eyebrow{color:var(--jade)}
.sh-head h2{font-size:22px;font-weight:700;line-height:1.2}
.sh-head p{font-size:14px;color:var(--muted)}
.xbtn{width:44px;height:44px;border:0;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;color:var(--ink)}
.lvlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lvrow{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:transparent;text-align:left;color:var(--ink)}
li+li>.lvrow{border-top:1px solid var(--line)}
.lvrow.cur{background:var(--tint)}
.lvrow:disabled{cursor:default}
.c40{width:40px;height:40px;flex-shrink:0;border-radius:50%;background:var(--jade);display:flex;align-items:center;justify-content:center;color:var(--on-jade);font-size:16px;font-weight:700}
.c40.ring{background:var(--surface);border:2.5px solid var(--jade);box-shadow:0 0 0 4px var(--jade-soft);color:var(--jade)}
.c40.lk{background:var(--lock);border:1.5px solid var(--line);color:var(--lock-ic)}
.lvrow .tx{flex:1;display:flex;flex-direction:column;min-width:0}
.lvrow .tx b{font-size:16px;font-weight:700}
.lvrow .tx small{font-size:13px;color:var(--muted)}
.lvrow:disabled .tx b{color:var(--muted)}
.lvrow .rt{font-size:14px;font-weight:700;color:var(--jade);font-variant-numeric:tabular-nums;white-space:nowrap}
.lvrow .rt.cur{font-size:13px}
.lvrow .rt.lk{font-size:13px;font-weight:400;color:var(--muted)}
.vocab{display:flex;flex-direction:column;gap:8px}
.vocab h3,.sub-h{font-size:14px;font-weight:700;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.vchip{display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.vchip b{font-size:15px;font-weight:700}
.vchip b [lang="zh"]{font-weight:500;font-size:13px;color:var(--muted)}
.vchip small{font-size:13px;color:var(--muted)}
.lrow{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:transparent;text-align:left;color:var(--ink)}
li+li>.lrow{border-top:1px solid var(--line)}
.lrow[aria-current="true"]{background:var(--tint)}
.lrow:disabled{cursor:default;color:var(--muted)}
.lrow .tx{flex:1;display:flex;flex-direction:column;min-width:0}
.lrow .tx .eyebrow{color:var(--muted)}
.lrow .tx b{font-size:16px;font-weight:700}
.lrow .tx small{font-size:13px;color:var(--muted)}
.lrow .rt{font-size:13px;font-weight:700;color:var(--jade);white-space:nowrap}
.lrow .rt.ok{color:var(--ok)}
.confirm-sh p{font-size:15px;color:var(--muted);line-height:1.45}

/* ---------- Exercices ---------- */
.ex{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:18px;padding:16px 16px 30px}
.ex.fbon{padding-bottom:var(--fbh,320px)}
.extop{display:flex;align-items:center;gap:12px}
.xlink{width:44px;height:44px;border:0;background:transparent;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;color:var(--ink)}
.prog{flex:1;height:10px;border-radius:5px;background:var(--jade-soft);overflow:hidden}
.prog i{display:block;height:100%;border-radius:5px;background:var(--jade);transition:width .3s}
.extop .cnt{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.exmeta{display:flex;flex-direction:column;gap:4px}
.exmeta>span{font-size:14px;color:var(--muted)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:13px;font-weight:700;color:var(--jade);background:var(--jade-soft);border-radius:999px;padding:3px 10px;align-self:flex-start}
.pill.half{color:var(--half);background:var(--half-soft)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.qcard.fr{padding:26px 18px}
.qcard h1{font-size:15px;font-weight:600;color:var(--muted)}
.q-py{font-size:40px;font-weight:600;line-height:1.1;overflow-wrap:anywhere}
.q-py.long{font-size:26px;line-height:1.25}
.q-zh{font-family:var(--f-han);font-size:22px;color:var(--muted)}
.q-zh.long{font-size:19px}
.q-fr{font-size:32px;font-weight:700;line-height:1.15}
.q-fr.long{font-size:24px;line-height:1.25}
.q-sub{font-size:15px;color:var(--muted)}
.tzg{display:flex;flex-wrap:wrap;justify-content:center;border:1.5px solid var(--grid)}
.tzg span{position:relative;width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-family:var(--f-han);font-size:30px;color:var(--muted)}
.tzg span+span{border-left:1.5px solid var(--grid)}
.tzg span::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--grid)}
.tzg span::after{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:1px dashed var(--grid)}
.tzg em{position:relative;font-style:normal}
.opts{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.opt{min-height:56px;text-align:left;padding:10px 18px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font-size:18px;font-weight:600;line-height:1.25}
.opt[aria-pressed="true"]{border:2px solid var(--jade);background:var(--jade-soft);font-weight:700;padding:9.5px 17.5px}
.opt.ok{border:2px solid var(--ok);background:var(--ok-soft);font-weight:700;padding:9.5px 17.5px}
.opt.bad{border:2px solid var(--bad);background:var(--bad-soft);padding:9.5px 17.5px}
.opt:disabled{cursor:default;opacity:1}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:15px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.field label small{font-weight:400;font-size:13px;color:var(--muted)}
.inp{height:56px;padding:0 16px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-size:20px;width:100%;outline:none}
.inp:focus{border-color:var(--jade)}
.inp.zh{font-family:var(--f-han);font-size:24px}
.inp.ok{border-color:var(--ok);background:var(--ok-soft)}
.inp.bad{border-color:var(--bad);background:var(--bad-soft)}
.inp:disabled{opacity:1;-webkit-text-fill-color:var(--ink)}
.readas{font-size:14px;color:var(--muted)}
.readas b{color:var(--ink);font-size:16px}
.tones{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tones button{min-height:56px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 0}
.tones button b{font-size:22px;font-weight:600;line-height:1.1}
.tones button small{font-size:11px;font-weight:600;color:var(--muted)}
.tones button:active{background:var(--jade-soft)}
.spacer{flex:1}

/* Panneau de correction */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;animation:up .18s ease-out}
.fb-in{width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px var(--safe-b);display:flex;flex-direction:column;gap:12px}
.fb.ok .fb-in{background:var(--ok-soft);border-top:2px solid var(--ok);gap:14px}
.fb.bad .fb-in{background:var(--bad-soft);border-top:2px solid var(--bad)}
.fb-t{display:flex;align-items:center;gap:10px}
.fb-t .c32{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--on-bad)}
.fb.ok .c32{background:var(--ok)}
.fb.bad .c32{background:var(--bad)}
.fb-t h2{font-size:21px;font-weight:700}
.fb.ok h2{color:var(--ok)}
.fb.bad h2{color:var(--bad)}
.fb-line{font-size:16px;line-height:1.45}
.fb-small{font-size:13px;color:var(--muted)}
.fb dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:16px;align-items:baseline}
.fb dt{font-size:14px;color:var(--muted)}
.fb dd{margin:0;min-width:0;overflow-wrap:anywhere}
.fb dd.yours{text-decoration:line-through;color:var(--muted)}
.fb dd.ans{display:flex;flex-direction:column}
.fb dd.ans b{font-size:18px}
.fb dd.ans [lang="zh"]{font-size:17px;color:var(--muted)}
.fb .cnote{background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.4}

/* ---------- Fins de niveau, contrôle, série ---------- */
.end{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:14px;padding:16px 16px 30px}
.end-top{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:28px;text-align:center}
.end-top.tight{gap:6px}
.end-top.intro{padding-top:4px}
.c72{width:72px;height:72px;border-radius:50%;background:var(--jade);display:flex;align-items:center;justify-content:center;color:var(--on-jade)}
.c72.half{background:var(--half-soft);border:2px solid var(--half);color:var(--half)}
.c72.soft{background:var(--jade-soft);color:var(--jade)}
.end-top h1{font-size:26px;font-weight:700;line-height:1.2}
.end-top p{font-size:15px;color:var(--muted)}
.end-top .eyebrow{color:var(--jade)}
.end-top .eyebrow.half{color:var(--half)}
.end-top .bigscore{font-size:56px;font-weight:700;line-height:1;color:var(--jade);font-variant-numeric:tabular-nums}
.end-top .bigscore.half{color:var(--half)}
.bigscore small{font-size:28px;color:var(--muted)}
.scorebox{padding:16px;display:flex;flex-direction:column;gap:10px}
.scorebox .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.scorebox .pct{font-size:34px;font-weight:700;color:var(--jade);font-variant-numeric:tabular-nums}
.scorebox.half .pct{color:var(--half)}
.scorebox .top span:last-child{font-size:15px;color:var(--muted);text-align:right}
.meter{position:relative;height:26px}
.meter .tr{position:absolute;left:0;right:0;top:0;height:10px;border-radius:5px;background:var(--jade-soft);overflow:hidden}
.meter .tr i{display:block;height:100%;background:var(--jade);border-radius:5px}
.scorebox.half .meter .tr{background:var(--half-soft)}
.scorebox.half .meter .tr i{background:var(--half)}
.meter .mk{position:absolute;left:80%;top:-3px;width:2px;height:16px;background:var(--ink)}
.meter .ml{position:absolute;left:80%;top:13px;transform:translateX(-50%);font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.unlock{background:var(--jade-soft);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.unlock .c40{background:var(--surface);border:2px solid var(--jade);color:var(--jade)}
.unlock .tx{display:flex;flex-direction:column;min-width:0}
.unlock .tx b{font-size:16px}
.unlock .tx span{font-size:14px;color:var(--soft-ink)}
.errs{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.errs h2{font-size:16px;font-weight:700}
.erri{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:2px}
.erri .h{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.erri .h [lang="zh"]{font-weight:500;color:var(--muted);font-size:15px}
.erri .y{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.erri .r{font-size:14px;overflow-wrap:anywhere}
.erri .r [lang="zh"]{color:var(--muted)}
.erri .lc{font-size:13px;font-weight:700}
.erri .lc.ok{color:var(--ok)} .erri .lc.half{color:var(--half)} .erri .lc.bad{color:var(--bad)}
.rules-box{padding:4px 16px}
.rules-box dl{margin:0;display:flex;flex-direction:column}
.rules-box dl>div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;font-size:15px}
.rules-box dl>div+div{border-top:1px solid var(--line)}
.rules-box dt{color:var(--muted)}
.rules-box dd{margin:0;font-weight:700;text-align:right}
.tchip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px;font-size:14px;font-weight:600}
.tchip .c20{width:20px;height:20px;border-radius:50%;background:var(--jade);display:flex;align-items:center;justify-content:center;color:var(--on-jade)}
.note-p{font-size:14px;color:var(--muted);line-height:1.45}
.res{padding:6px 16px 0;overflow:hidden}
.res>div{display:flex;flex-direction:column;margin-bottom:-1px}
.resrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.resrow .nm{flex:1;display:flex;flex-direction:column;min-width:0;font-size:15px;font-weight:600}
.resrow .nm small{font-size:12px;font-weight:700;color:var(--half)}
.segs{display:flex;gap:3px}
.segs i{width:12px;height:8px;border-radius:2px;background:var(--line)}
.segs i.on{background:var(--jade)}
.segs i.weak{background:var(--half)}
.resrow .sc{width:32px;text-align:right;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.linkcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;text-align:left;width:100%}
.linkcard.sm{min-height:48px;border-radius:12px;padding:0 14px;gap:10px}
.linkcard .tx{flex:1;display:flex;flex-direction:column;min-width:0}
.linkcard .tx b{font-size:16px}
.linkcard .tx span{font-size:14px;color:var(--muted)}
.linkcard.sm .tx{font-size:15px;font-weight:600}
.linkcard>svg{color:var(--muted)}
.stack8{display:flex;flex-direction:column;gap:8px}

/* ---------- Révision ---------- */
.errcard{background:var(--surface);border:1.5px solid var(--jade);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.errcard .top{display:flex;align-items:center;gap:14px}
.errcard .n{font-size:44px;font-weight:700;line-height:1;color:var(--bad);font-variant-numeric:tabular-nums}
.errcard .top>span{display:flex;flex-direction:column}
.errcard h2,.freecard h2{font-size:19px;font-weight:700}
.errcard .top small,.freecard .hd small{font-size:14px;color:var(--muted)}
.errcard p{font-size:14px;color:var(--muted)}
.empty{padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.empty .c56{width:56px;height:56px;border-radius:50%;background:var(--ok-soft);display:flex;align-items:center;justify-content:center;color:var(--ok)}
.empty p{font-size:14px;color:var(--muted);max-width:280px}
.freecard{padding:16px;display:flex;flex-direction:column;gap:12px}
.freecard .hd{display:flex;flex-direction:column;gap:2px}
.selbtn{min-height:52px;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:8px 14px;display:flex;align-items:center;gap:10px;color:var(--ink);width:100%}
.selbtn .tx{flex:1;display:flex;flex-direction:column;min-width:0}
.selbtn .tx small{font-size:13px;color:var(--muted)}
.selbtn .tx b{font-size:15px;font-weight:700}
.selbtn>span:last-child{font-size:15px;font-weight:700;color:var(--jade)}
.rsec{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.grp h3{padding:10px 14px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--jade);background:var(--tint)}
.grp ul{list-style:none;margin:0;padding:0}
.grp li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.grp li .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.grp li .tx b{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.grp li .tx b [lang="zh"]{font-weight:500;font-size:14px;color:var(--muted)}
.grp li .tx small{font-size:14px;color:var(--muted)}
.grp li .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.errpill{font-size:12px;font-weight:700;color:var(--bad);background:var(--bad-soft);border-radius:999px;padding:2px 8px;white-space:nowrap}
.dots{display:flex;gap:4px}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--dash)}
.dots i.on{background:var(--jade);border-color:var(--jade)}
.hist{list-style:none;margin:0;padding:0 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);margin-top:-1px}
.hist .d{width:92px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;flex-shrink:0}
.hist .k{flex:1;font-size:15px;font-weight:600;min-width:0}
.hist .s{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.dashed{padding:16px 14px;border:1.5px dashed var(--dash);border-radius:14px;font-size:15px;color:var(--muted)}
.selsh .lsel{display:flex;flex-direction:column;gap:8px}
.selsh .lsel+.lsel{border-top:1px solid var(--line);padding-top:12px}
.lsel-h{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;text-align:left;width:100%;color:var(--ink)}
.lsel-h .tx{flex:1;display:flex;flex-direction:column}
.lsel-h .tx b{font-size:16px}
.lsel-h .tx small{font-size:13px;color:var(--muted)}
.box{flex-shrink:0;width:22px;height:22px;border-radius:6px;border:2px solid var(--grid);display:flex;align-items:center;justify-content:center;color:var(--on-jade)}
.lsel-h[aria-pressed="true"] .box{background:var(--jade);border-color:var(--jade)}
.lsel-h[aria-pressed="mixed"] .box{border-color:var(--jade);color:var(--jade)}
.schip{border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;line-height:1.2;max-width:100%}
.schip span{font-weight:600;font-size:15px}
.schip small{font-size:12px;font-variant-numeric:tabular-nums}
.schip[aria-pressed="true"]{border-color:var(--jade);background:var(--jade-soft);color:var(--ink)}
.schip[aria-pressed="true"] small{color:var(--jade)}
.sel-acts{display:flex;gap:18px}
.sel-acts button{border:0;background:none;color:var(--jade);font-weight:700;font-size:15px;padding:6px 0}
.sticky-b{position:sticky;bottom:calc(-1 * var(--safe-b));background:var(--surface);padding:8px 0 0;margin-top:-8px}

/* ---------- Paramètres ---------- */
.set{overflow:hidden}
.swrow{width:100%;text-align:left;border:0;background:transparent;padding:14px 16px;display:flex;align-items:center;gap:14px;color:var(--ink)}
.set>*+*{border-top:1px solid var(--line)}
.swrow .tx{flex:1;display:flex;flex-direction:column;gap:2px}
.swrow .tx b{font-size:16px;font-weight:700}
.swrow .tx small{font-size:14px;color:var(--muted)}
.swrow:disabled{color:var(--muted);cursor:default}
.sw{width:52px;height:32px;flex-shrink:0;border-radius:16px;background:var(--sw-off);padding:3px;display:flex;justify-content:flex-start;transition:background .15s}
.sw i{width:26px;height:26px;border-radius:50%;background:var(--sw-knob-off);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.swrow[aria-checked="true"] .sw{background:var(--jade);justify-content:flex-end}
.swrow[aria-checked="true"] .sw i{background:var(--sw-knob-on);box-shadow:none}
.swrow:disabled .sw{background:var(--sw-dis)}
.swrow:disabled .sw i{box-shadow:0 1px 3px rgba(0,0,0,.15)}
.preview{padding:12px 16px;display:flex;align-items:center;gap:12px;background:var(--tint)}
.preview>small{font-size:13px;font-weight:600;color:var(--muted)}
.preview .pv{display:flex;flex-direction:column;line-height:1.15}
.preview .pv b{font-size:20px;font-weight:600}
.preview .pv [lang="zh"]{font-size:14px;color:var(--muted)}
.preview>span:last-child{font-size:14px;color:var(--muted)}
.themebox{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.themebox>b{font-size:16px;font-weight:700}
.themebox>small{font-size:14px;color:var(--muted)}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg3 button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--ink);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.seg3 button[aria-checked="true"]{background:var(--jade);color:var(--on-jade);font-weight:700}
.datarow{padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.datarow b{font-size:16px;font-weight:700}
.datarow span{font-size:14px;color:var(--muted);text-align:right}
.actrow{width:100%;text-align:left;border:0;background:transparent;padding:14px 16px;display:flex;flex-direction:column;gap:2px;color:var(--ink)}
.actrow b{font-size:16px;font-weight:700}
.actrow small{font-size:14px;color:var(--muted)}
.actrow.danger{color:var(--bad)}
a.actrow{text-decoration:none;box-sizing:border-box}
.xfer{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.xfer>b{font-size:16px;font-weight:700}
.xfer>small{font-size:14px;color:var(--muted)}
.xfer textarea{width:100%;font:inherit;font-size:13px;font-family:ui-monospace,Menlo,monospace;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical;word-break:break-all}
.msg-ok{font-size:14px;color:var(--ok)}
.msg-bad{font-size:14px;color:var(--bad)}

/* ---------- Mini-cours ---------- */
.cours{display:flex;flex-direction:column;gap:14px;padding:16px 16px 30px}
.cours-h{display:flex;flex-direction:column;gap:4px}
.cours-h .eyebrow{color:var(--jade)}
.cours-h h1{font-size:26px;font-weight:700;line-height:1.2}
.cs{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.cs h2{font-size:18px;font-weight:700}
.cs h3{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cs ul.rules{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.45}
.cs ul.rules li::marker{color:var(--jade)}
.vt{width:100%;border-collapse:collapse;font-size:15px}
.vt td{padding:7px 4px;border-top:1px solid var(--line);vertical-align:baseline}
.vt td:first-child{padding-right:14px;font-weight:700}
.vt td:first-child [lang="zh"]{font-weight:500;color:var(--muted);font-size:14px}
.vt td:last-child{color:var(--muted)}
.exs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.exs li{display:flex;flex-direction:column;gap:2px;font-size:15px}
.exs li b{font-weight:700}
.exs li [lang="zh"]{color:var(--muted)}
.exs li small{font-size:14px;color:var(--muted)}

@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Révision : bandeau de sélection ---------- */
.rband{background:var(--jade);border:0;border-radius:16px;box-shadow:0 4px 0 var(--jade-sh);display:flex;align-items:stretch;color:var(--on-jade);text-align:left;padding:0;margin-bottom:4px;width:100%}
.rband:active{transform:translateY(2px);box-shadow:0 2px 0 var(--jade-sh)}
.rband .tx{flex:1;padding:12px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rband .eyebrow{color:var(--hd-eyebrow)}
.rband b{font-size:21px;line-height:1.15}
.rband small{font-size:13px;font-weight:600;color:var(--hd-eyebrow)}
.rband .ic{width:60px;border-left:1px solid var(--hd-sep);display:flex;align-items:center;justify-content:center}
.rlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ropt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);margin-top:-1px;background:var(--surface);color:var(--ink);text-align:left;width:100%}
.ropt .rd{width:24px;height:24px;flex-shrink:0;border-radius:50%;border:2px solid var(--dash);box-sizing:border-box}
.ropt[aria-checked="true"] .rd{border:7px solid var(--jade)}
.ropt .tx{flex:1;display:flex;flex-direction:column}
.ropt .eyebrow{color:var(--jade)}
.ropt b{font-size:16px}
.ropt small{font-size:13px;color:var(--muted)}
.ropt .errpill{white-space:nowrap}

/* ---------- Écriture ---------- */
.resume{background:var(--jade);border:0;border-radius:16px;box-shadow:0 4px 0 var(--jade-sh);padding:14px 16px;display:flex;align-items:center;gap:12px;color:var(--on-jade);text-align:left;width:100%}
.resume .tx{flex:1;display:flex;flex-direction:column;gap:2px}
.resume .eyebrow,.resume .tx>span:last-child{color:var(--hd-eyebrow)}
.resume b{font-size:18px}
.resume .tx>span:last-child{font-size:14px}
.wlegend{display:flex;gap:14px;font-size:13px;color:var(--muted);padding:2px 2px 0}

.wchip.cur{background:var(--surface);border:2px solid var(--jade);color:var(--ink)}
.wchip.q{width:42px;height:42px;border:2px solid var(--jade);color:var(--jade);font-family:var(--f-ui);font-weight:700}
.wchip.blank{background:var(--lock)}
.wchip.plain{background:var(--bg);border:1px solid var(--line);color:var(--ink)}

.wlhead .eyebrow{color:var(--jade)}
.wlhead h1{font-size:24px;line-height:1.15}
.wprog{padding:16px;display:flex;flex-direction:column;gap:10px}
.wprog .top{display:flex;justify-content:space-between;font-size:15px;color:var(--muted)}
.wprog .top b{color:var(--ink);font-variant-numeric:tabular-nums}
.wprog .bar{height:10px;border-radius:5px;background:var(--jade-soft);overflow:hidden}
.wprog .bar i{display:block;height:100%;background:var(--jade);border-radius:5px}
.wprog small{font-size:13px;color:var(--muted);text-align:center}
.wtabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--lock);border-radius:12px;padding:4px}
.wtab{height:40px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:600;padding:0 4px}

.wlist{list-style:none;margin:0;padding:0;overflow:hidden}

.wrow .st{font-size:13px;color:var(--muted);white-space:nowrap}

.wsteps li.done{background:var(--jade-soft);color:var(--jade)}
.wsteps li.cur{background:var(--jade);color:var(--on-jade)}

.wsnd{width:44px;height:44px;border:0;border-radius:50%;background:var(--jade-soft);color:var(--jade);display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}

.winfo{font-size:14px;color:var(--muted);text-align:center;line-height:1.4}
.wacts{display:flex;gap:10px}
.wbtn{flex:1;height:48px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.wcount{display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:700}
.wdots{display:flex;gap:4px;flex-wrap:wrap}

.whint{background:var(--half-soft);border:1.5px solid var(--half);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--soft-ink)}

.wstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

const D_ZH=["","一","二","三","四","五","六","七","八","九"];
const D_PY=["","yī","èr","sān","sì","wǔ","liù","qī","bā","jiǔ"];
function numZh(n){if(n<10)return n?D_ZH[n]:"零";const t=Math.floor(n/10),u=n%10;return (t>1?D_ZH[t]:"")+"十"+(u?D_ZH[u]:"")}
function numPy(n){if(n<10)return n?D_PY[n]:"líng";const t=Math.floor(n/10),u=n%10;return (t>1?D_PY[t]:"")+"shí"+(u?(u===2?"'":"")+D_PY[u]:"")}
const FR_U=["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize"];
const FR_T={2:"vingt",3:"trente",4:"quarante",5:"cinquante",6:"soixante"};
function frNum(n){
  if(n<17)return FR_U[n];
  if(n<20)return "dix-"+FR_U[n-10];
  if(n<70){const t=Math.floor(n/10),u=n%10;return FR_T[t]+(u===0?"":u===1?" et un":"-"+FR_U[u])}
  if(n<80)return n===71?"soixante et onze":"soixante-"+frNum(n-60);
  if(n===80)return "quatre-vingts";
  return "quatre-vingt-"+frNum(n-80);
}
const nums=n=>n<=10?[frNum(n),String(n)]:[String(n),frNum(n)];
// Produit cartésien de fragments français
function combos(...parts){return parts.reduce((acc,p)=>{const arr=Array.isArray(p)?p:[p];const out=[];acc.forEach(a=>arr.forEach(b=>out.push(a+b)));return out},[""])}
const join=(...xs)=>xs.filter(Boolean).join(" ");
const pad2=n=>String(n).padStart(2,"0");
/* Heures : h = heure dite en chinois (1 à 12), period = "", "上午", "下午" ou "晚上". */
function hour24(h,period){if(period==="下午"||period==="晚上")return h===12?12:h+12;if(period==="上午")return h===12?0:h;return h}
function frHourWords(H){if(H===0)return["minuit"];if(H===12)return["midi","douze heures"];if(H===1)return["une heure"];
  let w=frNum(H);if(H>20&&H%10===1)w=w.replace(/un$/,"une");return[w+" heures"]}
function frClock(H,m){const out=[];new Set([String(H),pad2(H)]).forEach(x=>{out.push(x+":"+pad2(m),x+"h"+pad2(m),x+" h "+pad2(m));
  if(m===0)out.push(x+"h",x+" h");if(m>0&&m<10)out.push(x+"h"+m,x+" h "+m)});return out}
function frWords(H,m){const hw=frHourWords(H),nx=frHourWords((H+1)%24),out=[];
  if(m===0)out.push(...hw);
  else{hw.forEach(w=>{if(m===15)out.push(w+" et quart",w+" quinze");else if(m===30)out.push(w+" et demie",w+" et demi",w+" trente");else out.push(w+" "+frNum(m))});
    if(m===45)nx.forEach(w=>out.push(w+" moins le quart",w+" moins quart"));else if(m>30)nx.forEach(w=>out.push(w+" moins "+frNum(60-m)))}
  return out}
const PERIOD_FR={"上午":" du matin","下午":" de l'après-midi","晚上":" du soir"};
function frTimes(h,m,period){
  const H=hour24(h,period),out=[pad2(H)+":"+pad2(m)];
  out.push(...frClock(H,m),...frWords(H,m));
  if(!period){out.push(...frClock(h===12?0:h+12,m),...frWords(h===12?0:h+12,m))}
  else{const suf=PERIOD_FR[period];[...frClock(h,m).filter(x=>!/^0/.test(x)),...frWords(h===12?12:h,m)].forEach(x=>out.push(x+suf))}
  return[...new Set(out)];
}
// Une heure seule (mot) : W avec toutes les écritures françaises acceptées
function HEURE(zh,py,h,m,period,note){W(zh,py,frTimes(h,m,period).join("|"),note)}
// Action + « à » + heure, avec ou sans « tous les jours »
function AT(acts,h,m,period,daily){
  const all=frTimes(h,m,period),H=hour24(h,period),pref=H+" h"+(m?" "+pad2(m):"");
  const t=[pref,...all.filter(x=>x!==pref)],base=combos(acts," à ",t);
  if(!daily)return base;
  return[...combos(base,[" tous les jours"," chaque jour"]),...combos(["tous les jours ","chaque jour "],base)];
}

function invert(ph){

  return (refl?refl+" ":"")+verb+link+rest;
}
// Heure en chinois : formes acceptées pour h (1-12) et m, la première est affichée
function zhTime(h,m,period){
  const H=h===2?{zh:"两",py:"liǎng"}:h===1?{zh:"一",py:"yì"}:{zh:numZh(h),py:numPy(h)};
  const nh=h%12+1, NH=nh===2?{zh:"两",py:"liǎng"}:nh===1?{zh:"一",py:"yì"}:{zh:numZh(nh),py:numPy(nh)};
  const P=period?{zh:period,py:{"上午":"shàngwǔ","下午":"xiàwǔ","晚上":"wǎnshang"}[period]+" "}:{zh:"",py:""};
  const f=[];const add=(zh,py)=>f.push({zh:P.zh+zh,py:P.py+py});
  const base=(x,y)=>add(H.zh+"点"+x,H.py+" diǎn"+(y?" "+y:""));
  if(m===0) base("","");
  else if(m<10) base("零"+numZh(m)+"分","líng "+numPy(m)+" fēn");
  else if(m===15){const a=[["一刻","yí kè"],["十五分","shíwǔ fēn"]];if(Math.random()<.5)a.reverse();a.forEach(x=>base(...x))}
  else if(m===30){const a=[["半","bàn"],["三十分","sānshí fēn"]];if(Math.random()<.5)a.reverse();a.forEach(x=>base(...x))}
  else if(m===45){const a=[["三刻","sān kè"],["四十五分","sìshíwǔ fēn"]];if(Math.random()<.5)a.reverse();a.forEach(x=>base(...x));
    add(NH.zh+"点差一刻",NH.py+" diǎn chà yí kè");add("差一刻"+NH.zh+"点","chà yí kè "+NH.py+" diǎn")}
  else{base(numZh(m)+"分",numPy(m)+" fēn");base(numZh(m),numPy(m));
    if(m>=50){const r=60-m;add(NH.zh+"点差"+numZh(r)+"分",NH.py+" diǎn chà "+numPy(r)+" fēn");add("差"+numZh(r)+"分"+NH.zh+"点","chà "+numPy(r)+" fēn "+NH.py+" diǎn")}}
  const py=f.map(x=>x.py);
  // « à 15 h » en français : le pinyin sans 上午 / 下午 / 晚上 est aussi accepté
  f.forEach(x=>{if(P.py)py.push(x.py.slice(P.py.length))});

  return {zh:f.map(x=>x.zh),py:[...new Set(py)]};
}

/* ===== Normalisation et correction ===== */
const TONE_MARKS=/[̀́̄̌]/g;
function pyNorm(s){return (s||"").normalize("NFD").toLowerCase().replace(/v/g,"ü").replace(/[^a-z̀́̄̌̈]/g,"").normalize("NFC")}
function pyToneless(s){return pyNorm(s).normalize("NFD").replace(TONE_MARKS,"").normalize("NFC")}
function zhNorm(s){return (s||"").replace(/[^㐀-鿿豈-﫿]/g,"")}
function frBase(s){return (s||"").toLowerCase().replace(/œ/g,"oe").replace(/æ/g,"ae").normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/[’`´]/g,"'").replace(/[?!.;:,、«»"]/g," ").replace(/[-']/g," ").replace(/\s+/g," ").trim()}
function stripArticle(s){return s.replace(/^(le|la|les|l|un|une|des|du) /,"")}
function frVariants(str){
  const out=new Set();
  const add=x=>{const b=frBase(x);if(b){out.add(b);out.add(stripArticle(b))}};
  const expand=x=>{ // français(e) -> français, française
    const m=x.match(/^(.*?)\((e|s|es)\)(.*)$/);
    if(m){expand(m[1]+m[3]);expand(m[1]+m[2]+m[3]);return}
    add(x); add(x.replace(/\(.*?\)/g,""));
    x.replace(/\(.*?\)/g,"").split(/,| ou |\//).forEach(add);
  };
  expand(str); return out;
}
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 3;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}

function acceptedItems(item,ex){
  if(item.gen){
    if(ex===1){const k=frBase(item.fr[0]);return [item,...V.filter(v=>v.fr.some(f=>frBase(f)===k))]}
    const extra=ex===3&&item.twin?[item.twin]:[];
    const k=ex===2?zhNorm(item.zh[0]):pyNorm(item.py[0]);
    const same=V.filter(v=>ex===2?v.zh.some(z=>zhNorm(z)===k):v.py.some(p=>pyNorm(p)===k));
    return [item,...extra,...same];
  }
  if(ex===1){const k=frBase(item.fr[0]);return V.filter(v=>v.fr.some(f=>frBase(f)===k))}
  if(ex===2){const k=zhNorm(item.zh[0]);return V.filter(v=>v.zh.some(z=>zhNorm(z)===k))}
  const k=pyNorm(item.py[0]);return V.filter(v=>v.py.some(p=>pyNorm(p)===k))
}
function gradePy(ans,items){
  const a=pyNorm(ans); if(!a) return {s:0,why:"vide"};
  const all=items.flatMap(v=>v.py);
  if(all.some(p=>pyNorm(p)===a)) return {s:1};
  if(all.some(p=>pyToneless(p)===pyToneless(a))) return {s:.5,why:"ton"};
  return {s:0};
}
function gradeZh(ans,items){
  const a=zhNorm(ans); if(!a) return {s:0,why:"vide"};
  return items.flatMap(v=>v.zh).some(z=>zhNorm(z)===a)?{s:1}:{s:0};
}
function gradeFr(ans,items){
  const a=stripArticle(frBase(ans)); if(!a) return {s:0,why:"vide"};
  const vars=new Set(); items.forEach(v=>v.fr.forEach(f=>frVariants(f).forEach(x=>vars.add(x))));
  if(vars.has(a)||vars.has(frBase(ans))) return {s:1};
  if(a.length>=6) for(const x of vars){ if(x.length>=6 && lev(a,x)<=(x.length>=18?2:1)) return {s:1,why:"typo"} }
  return {s:0};
}

/* ===== Saisie des tons ===== */
const MARK={1:"̄",2:"́",3:"̌",4:"̀"};
function applyTone(input,tone){
  const pos=input.selectionStart??input.value.length;
  const before=input.value.slice(0,pos), after=input.value.slice(pos);
  if(tone==="u"){ setVal(input,before+"ü",after); return }
  const nfd=before.normalize("NFD");
  const m=nfd.match(/[a-zA-Z̀́̄̌̈]+$/);
  if(!m) return;
  let syl=m[0].replace(TONE_MARKS,""), head=nfd.slice(0,nfd.length-m[0].length);
  const low=syl.toLowerCase(); let idx=-1;
  if(low.includes("a")) idx=low.indexOf("a");
  else if(low.includes("e")) idx=low.indexOf("e");
  else if(low.includes("ou")) idx=low.indexOf("o");
  else { for(let i=low.length-1;i>=0;i--){ if("iou".includes(low[i])){idx=i;break} } }
  if(idx<0) return;
  let end=idx+1; if(syl[end]==="̈") end++;
  if(tone!==0) syl=syl.slice(0,end)+MARK[tone]+syl.slice(end);
  setVal(input,(head+syl).normalize("NFC"),after);
}
function setVal(input,before,after){input.value=before+after;const p=before.length;try{input.setSelectionRange(p,p)}catch(e){}}

/* ===== Code de transfert de progression ===== */
const CODE_PREFIX="RC1-";
function exportCode(){
  const data={errors:state.errors,series:state.series,off:state.off,exOff:state.exOff,themeScores:state.themeScores,lv:state.lv,ctl:state.ctl,showZh:state.showZh,zhEx:state.zhEx,theme:state.theme,wr:state.wr||{},days:state.days||{},srs:state.srs||{},fx:state.fx||{}};
  const bytes=new TextEncoder().encode(JSON.stringify(data));
  let bin="";bytes.forEach(b=>bin+=String.fromCharCode(b));
  return CODE_PREFIX+btoa(bin);
}
function importCode(code){
  const c=(code||"").replace(/\s+/g,"");
  if(!c.startsWith(CODE_PREFIX)) throw new Error("Ce code ne vient pas de l'application (il doit commencer par "+CODE_PREFIX+").");
  let data;
  try{const bin=atob(c.slice(CODE_PREFIX.length));data=JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,ch=>ch.charCodeAt(0))))}
  catch(e){throw new Error("Code incomplet ou abîmé. Recopie-le en entier.")}
  if(!data||typeof data.errors!=="object"||!Array.isArray(data.series)) throw new Error("Code illisible.");
  state={...freshState(),errors:data.errors,series:data.series,off:Array.isArray(data.off)?data.off:[],exOff:Array.isArray(data.exOff)?data.exOff:[],themeScores:data.themeScores||{},lv:data.lv||{},ctl:data.ctl||{},showZh:!!data.showZh,zhEx:!!data.zhEx,theme:data.theme||state.theme,wr:data.wr&&typeof data.wr==="object"?data.wr:{},days:data.days&&typeof data.days==="object"?data.days:{},srs:data.srs&&typeof data.srs==="object"?data.srs:{},fx:data.fx&&typeof data.fx==="object"?data.fx:{},updated:0};
  registerGen(); save();
}

/* ===== Construction d'une série ===== */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
/* Types d'exercices activés (state.exOff = types désactivés). Les phrases n'existent qu'en 2 et 3. */
const EX_TYPES=[1,3];
const exOn=()=>EX_TYPES.filter(x=>!(state.exOff||[]).includes(x));
const phrasesOk=()=>exOn().length>0;
function pickEx(item,pref){
  let opts=[1,3].filter(x=>exOn().includes(x));
  if(!opts.length) return null;
  if(pref&&pref.length){const p=pref.filter(x=>opts.includes(x));if(p.length)opts=p}
  return opts[Math.floor(Math.random()*opts.length)];
}
function pool(){const off=state.off||[];return V.filter(v=>!off.includes(v.th))}
function themesOn(){const off=state.off||[];return THEMES.filter(t=>!off.includes(t))}
const errScore=id=>state.errors[id].n-state.errors[id].ok;
function pileIds(onlyOn){const on=themesOn();return Object.keys(state.errors).filter(id=>IT(id)&&(!onlyOn||on.includes(IT(id).th)))}
/* Sens des questions : moitié français vers pinyin, moitié pinyin vers français,
   équilibré séparément sur les mots et sur les phrases. Une erreur revient dans le sens
   où elle a été ratée quand le quota le permet. */
function assignEx(qs){
  const on=exOn(); if(on.length<2){qs.forEach(q=>q.ex=on[0]||3);return qs}
  let extra1=Math.random()<.5;
  const pref=q=>{const e=q.review&&state.errors[q.id];const ex=(e&&e.ex)||[];return ex.includes(1)&&!ex.includes(3)?1:ex.includes(3)&&!ex.includes(1)?3:0};
  ["w","p"].forEach(kind=>{
    const g=shuffle(qs.filter(q=>(IT(q.id).t==="p"?"p":"w")===kind));
    let c1=Math.floor(g.length/2); if(g.length%2){if(extra1)c1++;extra1=!extra1}
    let c3=g.length-c1;
    g.sort((a,b)=>(pref(b)?1:0)-(pref(a)?1:0));
    g.forEach(q=>{const p=pref(q);let ex=p===1&&c1?1:p===3&&c3?3:(c1?1:3);if(ex===1)c1--;else c3--;q.ex=ex});
  });
  return qs;
}
function buildErrorSeries(){
  const w=shuffle(pileIds(true).filter(id=>pickEx(IT(id)))).sort((a,b)=>errScore(b)-errScore(a)).slice(0,SERIES_LEN);
  return shuffle(assignEx(w.map(id=>({id,review:true}))));
}
/* 10 mots + 10 phrases. Les phrases mêlent celles du cours et des variantes générées.
   S'il manque d'un côté (thèmes choisis), l'autre complète. */
function buildSeries(){
  if(!exOn().length) return [];
  const P0=pool(), on=themesOn(), pOk=phrasesOk(), canGen=pOk&&TEMPLATES.some(t=>on.includes(t.th)&&!t.kind), canGenW=TEMPLATES.some(t=>on.includes(t.th)&&t.kind==="w");
  const words=shuffle(P0.filter(v=>v.t==="w")), course=pOk?shuffle(P0.filter(v=>v.t==="p")):[];
  const N=Math.min(SERIES_LEN,words.length+course.length+(canGen||canGenW?SERIES_LEN:0));
  const qs=[],used=new Set(),push=(it,review)=>{used.add(it.id);qs.push({id:it.id,ex:review?pickEx(it,state.errors[it.id].ex):pickEx(it),review:!!review})};
  const review=shuffle(pileIds(true).filter(id=>pickEx(IT(id)))).sort((a,b)=>errScore(b)-errScore(a)).slice(0,Math.min(MAX_REVIEW,N)).map(IT);
  let wantW=Math.min(WORDS_PER_SERIES,words.length+(canGenW?WORDS_PER_SERIES:0)), wantP=N-wantW;
  review.forEach(it=>push(it,true));
  let nW=review.filter(it=>it.t==="w").length, nP=review.length-nW;
  // phrases : moitié cours, moitié variantes
  const genTarget=canGen?Math.ceil((wantP-nP)/2):0;
  let ci=0,tries=0,g=0;
  while(nP<wantP&&ci<course.length&&(nP<wantP-genTarget||!canGen)){const it=course[ci++];if(!used.has(it.id)){push(it);nP++}}
  while(nP<wantP&&canGen&&tries++<200){const it=genOne(on);if(it&&!used.has(it.id)){push(it);nP++;g++}}
  while(nP<wantP&&ci<course.length){const it=course[ci++];if(!used.has(it.id)){push(it);nP++}}
  // mots : jusqu'à 3 heures générées si un thème de l'heure est coché, plus si les mots manquent
  let gw=0,tw=0;const wantGW=canGenW?Math.max(3,wantW-words.length):0;
  while(canGenW&&gw<wantGW&&qs.length<N&&tw++<100){const it=genOne(on,"w");if(it&&!used.has(it.id)){push(it);gw++}}
  for(let i=0;qs.length<N&&i<words.length;i++){if(!used.has(words[i].id))push(words[i])}
  while(canGenW&&qs.length<N&&tw++<200){const it=genOne(on,"w");if(it&&!used.has(it.id))push(it)}
  return shuffle(assignEx(qs));
}

  const days=state.days||{},has=n=>!!days[keyOf(n)],t=todayN(),done=has(t);
  const end=done?t:has(t-1)?t-1:null;let len=0;if(end!==null)for(let n=end;has(n);n--)len++;
  const ns=Object.keys(days).map(dayNum).sort((a,b)=>a-b);let best=0,run=0,prev=null;
  ns.forEach(n=>{run=prev!==null&&n===prev+1?run+1:1;if(run>best)best=run;prev=n});

function themeWords(ths){
  const own=V.filter(v=>ths.includes(v.th)&&v.t==="w");
  if(own.length) return own;
  const txt=V.filter(v=>ths.includes(v.th)&&v.t==="p").map(v=>v.zh[0]).join(""),maxT=Math.max(...ths.map(t=>THEMES.indexOf(t)));
  return V.filter(v=>v.t==="w"&&THEMES.indexOf(v.th)<=maxT&&txt.includes(v.zh[0])).sort((a,b)=>b.zh[0].length-a.zh[0].length).slice(0,12);
}
const themeCanGenW=ths=>TEMPLATES.some(x=>ths.includes(x.th)&&x.kind==="w");
// Phrases : celles du thème (moitié cours, moitié variantes) ; s'il en manque,
// des phrases d'autres thèmes qui utilisent son vocabulaire, en priorité des leçons déjà vues.
/* Une phrase n'est proposée que si ses caractères ont été enseignés comme mots, dans la leçon ou avant
   (plus les pronoms et 吗, connus dès la leçon 1). */
const BASIC_CH=new Set([..."我你他她们吗"]),_taught=[];
function taughtChars(li){
  if(_taught[li])return _taught[li];
  const set=new Set();V.forEach(v=>{if(v.t==="w"&&LESSONS.indexOf(LESSON_OF[v.th])<=li)[...v.zh[0]].forEach(c=>set.add(c))});
  return _taught[li]=set;
}
const phraseOk=v=>{const k=taughtChars(LESSONS.indexOf(LESSON_OF[v.th]));return [...v.zh[0]].every(c=>!/[㐀-鿿]/.test(c)||k.has(c)||BASIC_CH.has(c))};
function themePhrases(ths,words,n){
  const course=shuffle(V.filter(v=>ths.includes(v.th)&&v.t==="p"&&phraseOk(v))),canGen=TEMPLATES.some(t=>ths.includes(t.th)&&!t.kind);
  const out=[],used=new Set(),add=it=>{if(it&&it.t==="p"&&!used.has(it.id)&&out.length<n){used.add(it.id);out.push(it)}};
  course.slice(0,canGen?Math.ceil(n/2):n).forEach(add);
  let tries=0;while(canGen&&out.length<n&&tries++<100) add(genOne(ths));
  course.forEach(add);
  if(out.length<n){
    const maxT=Math.max(...ths.map(t=>THEMES.indexOf(t))),keys=words.map(w=>w.zh[0]);
    // seulement des thèmes déjà vus (jamais un thème plus avancé du parcours)
    shuffle(V.filter(v=>v.t==="p"&&THEMES.indexOf(v.th)<=maxT&&phraseOk(v)&&keys.some(k=>v.zh[0].includes(k)))).forEach(add);
  }
  return out;
}
// Mots d'un thème. S'il en a peu, on ajoute ceux de ses phrases, puis ceux des thèmes précédents de la leçon.
function levelWords(th){
  const l=LESSON_OF[th],li=LI(l),w=themeWords([th]).slice();
  const add=v=>{if(w.length<LEVEL_LEN&&!w.includes(v))w.push(v)};
  if(w.length<LEVEL_LEN){
    const txt=V.filter(v=>v.th===th&&v.t==="p").map(v=>v.zh[0]).join("");
    V.filter(v=>v.t==="w"&&THEMES.indexOf(v.th)<=THEMES.indexOf(th)&&txt.includes(v.zh[0])).sort((a,b)=>b.zh[0].length-a.zh[0].length).forEach(add);
  }
  if(w.length<5) l.themes.slice(0,l.themes.indexOf(th)).reverse().forEach(t=>shuffle(V.filter(v=>v.th===t&&v.t==="w")).forEach(v=>{if(w.length<5)add(v)}));
  return w;
}
// 4 propositions : la bonne et 3 sens proches (même thème, puis même leçon, puis tout le cours)
function qcmOptions(item,th){
  const acc=new Set([...item.fr,...acceptedItems(item,3).flatMap(v=>v.fr)].map(frBase));
  const seen=new Set([frBase(item.fr[0])]),out=[];
  const tryAdd=v=>{if(out.length>=3||v===item||v.t!==item.t)return;const k=frBase(v.fr[0]);
    if(seen.has(k)||v.fr.some(x=>acc.has(frBase(x))))return;seen.add(k);out.push(v.fr[0])};
  const l=LESSON_OF[th];
  shuffle(V.filter(v=>v.th===th)).forEach(tryAdd);
  shuffle(V.filter(v=>LESSON_OF[v.th]===l)).forEach(tryAdd);
  shuffle(V.slice()).forEach(tryAdd);
  return shuffle([item.fr[0],...out]);
}
const genCopy=it=>({zh:it.zh,py:it.py,fr:it.fr.slice(0,80),note:it.note,th:it.th,t:it.t,gen:true,twin:it.twin&&{zh:it.twin.zh,py:it.twin.py,fr:it.twin.fr.slice(0,80)}});
const withGen=q=>{const it=IT(q.id);if(it&&it.gen)q.g=genCopy(it);return q};
function restoreGen(r){if(r&&r.qs)r.qs.forEach(q=>{if(q.g&&!IT(q.id))GEN[q.id]={...q.g,id:q.id}})}
function zhSome(qs,n){if(!zhExOn())return;shuffle(qs.filter(q=>q.ex!=="qcm"&&hasHan(IT(q.id)))).slice(0,n).forEach(q=>q.ex=2)}
function buildLevel(th,i){
  const words=shuffle(levelWords(th).slice());let qs;
  if(i<3){
    const ws=words.slice(0,LEVEL_LEN);
    if(i>0&&themeCanGenW([th])){let k=0,t=0;while(k<2&&t++<30){const g=genOne([th],"w");if(g&&!ws.includes(g)){if(ws.length>=LEVEL_LEN)ws[ws.length-1-k]=g;else ws.push(g);k++}}}
    qs=shuffle(ws).map(v=>({id:v.id,ex:i===0?"qcm":i===1?3:1}));
    if(i===0) qs.forEach(q=>q.opts=qcmOptions(IT(q.id),th));
    if(i===2) zhSome(qs,3);
  }else{
    const items=themePhrases([th],words,LEVEL_LEN);
    for(const w of words){if(items.length>=LEVEL_LEN)break;if(!items.includes(w))items.push(w)}
    let one=Math.random()<.5;
    qs=shuffle(items).map(v=>{one=!one;return {id:v.id,ex:one?1:3}});
    zhSome(qs,2);
  }
  return qs.map(withGen);
}
function buildCtl(l){
  const ths=l.themes,base=Math.floor(CTL_LEN/ths.length),extra=CTL_LEN-base*ths.length,used=new Set(),qs=[];
  const plan=["qcm","p1",3,"p3",1];
  ths.forEach((th,ti)=>{
    const k=base+(ti<extra?1:0),words=shuffle(levelWords(th).filter(v=>!v.gen)),phr=themePhrases([th],words,k);
    let wi=0,pi=0;
    for(let j=0;j<k;j++){
      let t=plan[j%plan.length],it=null;
      if(typeof t==="string"&&t[0]==="p"){while(pi<phr.length&&used.has(phr[pi].id))pi++;it=phr[pi++]||null;t=t==="p1"?1:3}
      if(!it){while(wi<words.length&&used.has(words[wi].id))wi++;it=words[wi++]||null}
      if(!it){while(pi<phr.length&&used.has(phr[pi].id))pi++;it=phr[pi++]||null;if(t==="qcm")t=3}
      if(!it)continue;
      if(t==="qcm"&&it.t!=="w")t=3;
      used.add(it.id);
      const q={id:it.id,ex:t,th};if(t==="qcm")q.opts=qcmOptions(it,th);qs.push(q);
    }
  });
  zhSome(qs,3);
  return shuffle(qs).map(withGen);
}

/* ---------- Saisie du pinyin avec chiffres (mei2you3 → méiyǒu) ---------- */
function markSyl(syl,tone){
  if(!tone||tone===5) return syl;
  const low=syl.toLowerCase();let idx=-1;
  if(low.includes("a"))idx=low.indexOf("a");else if(low.includes("e"))idx=low.indexOf("e");else if(low.includes("ou"))idx=low.indexOf("o");
  else for(let i=low.length-1;i>=0;i--)if("iouü".includes(low[i])){idx=i;break}
  if(idx<0) return syl;
  return (syl.slice(0,idx+1)+MARK[tone]+syl.slice(idx+1)).normalize("NFC");
}
const toMarks=s=>(s||"").replace(/u:/g,"ü").replace(/([A-Za-zÀ-ɏ]+)([1-5])/g,(m,syl,t)=>markSyl(syl.replace(/v/g,"ü"),+t));

/* Dernière chance (séries de la Révision) : jusqu'à 3 questions ratées reviennent dans le même sens.

const LAST_CHANCES=3;
function addLC(){

}

/* ---------- Fin de contrôle ---------- */
function finishCtl(){
  const r=R,l=LESSONS.find(x=>x.id===r.lid),total=r.res.length,good=r.res.filter(x=>x.s===1).length,need=Math.round(total*.8);
  const passed=good>=need,prev=state.ctl[l.id]||{};
  const score20=total?Math.round(good/total*20):0;
  state.ctl[l.id]={best:Math.max(prev.best||0,score20),passed:passed||!!prev.passed,date:Date.now()};
  state.series.push({date:nowStr(),score:total?good/total*20:0,themes:`Contrôle, ${lower(l.n)}`,kind:"ctl"});state.series=state.series.slice(-30);
  const nx=LESSONS[LI(l)+1];
  const sday=passed?markDay():null,perfect=total>0&&good===total;
  if(passed&&nx)state.view=nx.id;
  save();R=null;
  const rows=l.themes.map(th=>{const rr=r.res.filter(x=>x.th===th),ok=rr.filter(x=>x.s===1).length,weak=rr.length>0&&ok/rr.length<.8;return {th,ok,n:rr.length,weak}}).filter(x=>x.n);
  const resH=`<section class="card res" aria-label="Résultat par thème"><div>${rows.map(x=>`<div class="resrow"><span class="nm">${esc(x.th)}${!passed&&x.weak?`<small>À revoir</small>`:""}</span>
    <span class="segs" aria-hidden="true">${Array.from({length:x.n},(_,k)=>`<i class="${k<x.ok?(!passed&&x.weak?"weak":"on"):""}"></i>`).join("")}</span><span class="sc">${x.ok}/${x.n}</span></div>`).join("")}</div></section>`;
  const errs=r.res.filter(x=>x.s<1),pile=pileIdsAll().length;
  if(passed){
    app.innerHTML=`<div class="end">
      <div class="end-top tight"><span class="eyebrow">Contrôle, ${esc(lower(l.n))}</span><p class="bigscore${perfect?" gold":""}">${good}<small> / ${total}</small></p><h1>${esc(l.n)} ${perfect?"parfaite":"validée"}</h1><p>${esc(l.t)}</p></div>
      ${resH}
      ${candoCard(CANDO_L[l.id],true)}${streakCard(sday)}
      <section class="unlock" aria-label="Leçon débloquée"><span class="c40">${I.unlock()}</span><span class="tx"><b>Leçon suivante débloquée</b><span>${nx?`${esc(nx.n)}, ${esc(nx.t)}`:"Elle apparaît dès que tu ajoutes son vocabulaire."}</span></span></section>
      ${errs.length?`<button class="linkcard" id="toRev"><span class="tx"><b>${errs.length} ${plural(errs.length,"erreur ajoutée","erreurs ajoutées")} à ta révision</b><span lang="zh-Latn-pinyin">${esc(errs.slice(0,3).map(x=>IT(x.id)?IT(x.id).py[0]:"").join(", "))}</span></span>${I.chev()}</button>`:""}
      <div class="spacer"></div>
      <button class="btn" id="bk">Voir les leçons</button></div>`;
    const t=document.getElementById("toRev");if(t)t.onclick=()=>go("revision");
  }else{
    const weak=rows.filter(x=>x.weak);
    app.innerHTML=`<div class="end">
      <div class="end-top tight"><span class="eyebrow half">Contrôle, ${esc(lower(l.n))}</span><p class="bigscore half">${good}<small> / ${total}</small></p><h1>Pas encore validée</h1><p>Il faut ${need} / ${total}. ${need-good<=2?`Plus que ${need-good} ${plural(need-good,"point","points")}, tu y es presque. `:""}Tes niveaux restent validés.</p></div>
      ${resH}
      ${weak.length?`<section class="stack8" aria-label="Thèmes à revoir"><h2 class="sub-h">Revoir un thème avant de repasser</h2>${weak.map(x=>`<button class="linkcard sm" data-th="${esc(x.th)}"><span class="tx">${esc(x.th)}</span>${I.chev()}</button>`).join("")}</section>`:""}
      <div class="spacer"></div>
      ${pile?`<button class="btn" id="toRev">Réviser mes ${pile} ${plural(pile,"erreur","erreurs")}</button><button class="btn link" id="again">Repasser le contrôle</button>`:`<button class="btn" id="again">Repasser le contrôle</button>`}
      <button class="btn link" id="bk">Retour aux leçons</button></div>`;
    const t=document.getElementById("toRev");if(t)t.onclick=()=>go("revision");
    document.getElementById("again").onclick=()=>renderCtlIntro(l);
    app.querySelectorAll(".linkcard[data-th]").forEach(b=>b.onclick=()=>{state.view=l.id;go("lessons");themeSheet(l,l.themes.indexOf(b.dataset.th))});
  }
  document.getElementById("bk").onclick=()=>go("lessons");
}

/* ---------- Fin de série (Révision) ---------- */
function finishSeries(){
  const r=R,bonus=x=>x.last?(1-x.s)*x.last.s/2:0;
  const nq=r.res.length,total=r.res.reduce((s,x)=>s+x.s+bonus(x),0),note=nq?Math.round(total/nq*20*2)/2:0;
  const lc=r.res.filter(x=>x.last),lcOk=lc.filter(x=>x.last.s===1).length;
  const label=r.mode==="errors"?"Mes erreurs":r.mode==="due"?"Révision du jour":selLabel();
  state.series.push({date:nowStr(),score:note,themes:label,kind:r.mode==="errors"?"errors":r.mode==="due"?"due":"free"});state.series=state.series.slice(-30);
  const sday=note>=10?markDay():null;save();
  const errs=r.res.filter(x=>x.s<1).sort((a,b)=>THEMES.indexOf(IT(a.id).th)-THEMES.indexOf(IT(b.id).th));
  const pile=pileIdsAll().length,mastered=r.res.filter(x=>x.review&&!state.errors[x.id]).length,good=note>=10;
  const mode=r.mode,dueLeft=dueIds(true).length;R=null;
  const info=[errs.length?`${errs.length} ${plural(errs.length,"question","questions")} avec erreur`:"Aucune erreur"];
  if(lc.length)info.push(`dernière chance : ${lcOk} / ${lc.length}`);
  if(mastered)info.push(`${mastered} ${plural(mastered,"élément sorti","éléments sortis")} de la liste`);
  info.push(`${pile} à retravailler`);
  app.innerHTML=`<div class="end">
    <div class="end-top tight"><span class="eyebrow${good?"":" half"}">${mode==="errors"?"Mes erreurs":mode==="due"?"Révision du jour":"Série libre"}</span><p class="bigscore${good?"":" half"}">${fmt(note)}<small> / 20</small></p><h1>Série terminée</h1><p>${esc(info.join(", "))}</p></div>
    ${streakCard(sday)}${errsCard(errs,true,`${errs.length} ${plural(errs.length,"erreur","erreurs")} et corrections`)}
    ${dueLeft>0?`<button class="linkcard" id="moredue"><span class="tx"><b>Encore ${dueLeft} ${plural(dueLeft,"élément à réviser","éléments à réviser")} aujourd'hui</b><span>Enchaîne tant que tu y es</span></span>${I.chev()}</button>`:(mode==="due"?`<p class="nudge ok">Tout est révisé pour aujourd'hui.</p>`:"")}
    <div class="spacer"></div>
    <button class="btn" id="again">Nouvelle série</button><button class="btn link" id="bk">Retour à la révision</button></div>`;
  document.getElementById("again").onclick=()=>startSeries(mode);
  const md=document.getElementById("moredue");if(md)md.onclick=()=>startSeries("due");
  document.getElementById("bk").onclick=()=>go("revision");
}

/* ===== Onglet Révision ===== */
function selLabel(){
  const off=new Set(state.off||[]),on=THEMES.filter(t=>!off.has(t)).length,N=THEMES.length;
  if(on===N)return `Toutes les leçons, ${N} thèmes sur ${N}`;
  if(on===0)return "Aucun thème choisi";
  const full=LESSONS.filter(l=>l.themes.every(t=>!off.has(t)));
  const part=LESSONS.some(l=>l.themes.some(t=>!off.has(t))&&!l.themes.every(t=>!off.has(t)));
  if(!part){const n=full.map(lessonNo);return `${n.length===1?`Leçon ${n[0]}`:`Leçons ${n.slice(0,-1).join(", ")} et ${n[n.length-1]}`}, ${on} ${plural(on,"thème","thèmes")} sur ${N}`}
  return `${on} ${plural(on,"thème","thèmes")} sur ${N}`;
}
function seriesSize(){
  const P0=pool(),on0=themesOn(),pOk=phrasesOk();
  return exOn().length?Math.min(SERIES_LEN,P0.filter(v=>v.t==="w"||pOk).length+(TEMPLATES.some(t=>on0.includes(t.th)&&(pOk||t.kind==="w"))?SERIES_LEN:0)):0;
}
function histKind(s){
  if(s.kind==="due")return "Révision du jour";
  if(s.kind==="ctl")return s.themes;
  if(s.kind==="errors"||s.themes==="Révision des erreurs"||s.themes==="Mes erreurs")return "Mes erreurs";
  return "Série libre";
}
/* Bandeau de sélection : toutes les leçons, une leçon, ou une sélection de thèmes */
function selInfo(){
  const off=new Set(state.off||[]),on=THEMES.filter(t=>!off.has(t));
  if(on.length===THEMES.length)return {k:"all",ey:"Réviser",t:"Toutes les leçons",s:`${LESSONS.length} leçons, ${THEMES.length} thèmes`};
  const ls=LESSONS.filter(l=>l.themes.some(t=>!off.has(t)));
  if(ls.length===1&&ls[0].themes.every(t=>!off.has(t))){const l=ls[0];return {k:l.id,ey:`Réviser, ${lower(l.n)}`,t:l.t,s:`${l.themes.length} ${plural(l.themes.length,"thème","thèmes")}`}}
  if(!on.length)return {k:"none",ey:"Réviser",t:"Aucun thème choisi",s:"Touche pour choisir"};
  return {k:"custom",ey:"Réviser",t:"Sélection personnalisée",s:selLabel()};
}

function selSheet(){

/* ===== Onglet Écriture =====
   Maquette « Révisions chinois, refonte », section 5.
   Organisé par leçon, toutes les leçons ouvertes. Chaque caractère passe par 3 étapes :
   observer l'ordre des traits, tracé guidé, de mémoire. Ordre et sens des traits vérifiés,
   indice au 2e essai raté sur un trait. Maîtrisé après 2 tracés de mémoire sans faute.
   Série de 8, priorité aux caractères pas encore maîtrisés.
   Suivi propre à l'onglet (state.wr), sans effet sur les niveaux ni sur la liste d'erreurs.
   Tracé : bibliothèque Hanzi Writer (MIT). Données de traits : hanzi-writer-data
   (Make Me a Hanzi, Arphic Public License), chargées depuis hanzi-data.js (window.HANZI_DATA). */

const WR_SERIES=8, WR_MASTER=2;
const WSTEPS=["Observer","Guidé","Mémoire"];
const HAN_RE=/^[㐀-鿿]+$/;
const hasData=c=>!!(window.HANZI_DATA&&window.HANZI_DATA[c]);
const wrOk=()=>typeof window.HanziWriter==="function"&&!!window.HANZI_DATA;
const wrRec=c=>(state.wr&&state.wr[c])||null;
const wrSt=c=>{const r=wrRec(c);return r&&r.ok>=WR_MASTER?"m":r&&r.seen?"c":"n"};
const wrStLabel={m:"Maîtrisé",c:"En cours",n:"Nouveau"};
I.pen=()=>svg(22,'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>');
I.back=()=>svg(24,'<path d="M15 6l-6 6 6 6"/>');
I.sound=()=>svg(22,'<path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/>');
I.warn=()=>svg(22,'<path d="M12 3l10 18H2z"/><path d="M12 10v5"/><path d="M12 18h.01"/>');
I.flame=(w=22)=>svg(w,'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>');
I.star=(w=22)=>svg(w,'<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.8 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/>');
I.grid=()=>svg(22,'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>');

/* ---------- Mots et caractères d'une leçon ----------
   Un mot est gardé s'il apporte au moins un caractère nouveau dans la leçon.
   Les mots redoublés (妈妈, 哥哥) se réduisent à leur caractère. */
const _wrCache={};
function firstSyl(py,word){
  // pinyin d'un caractère redoublé : 1re moitié (māma → mā, jiějie → jiě)
  const single=V.find(v=>v.t==="w"&&v.zh[0]===word[0]);
  if(single)return single.py[0];
  const p=py.replace(/\s+/g,"");return p.slice(0,Math.ceil(p.length/2));
}
function wrWords(l){
  if(_wrCache[l.id])return _wrCache[l.id];
  const seen=new Set(),out=[];
  V.filter(v=>LESSON_OF[v.th]===l&&v.t==="w").forEach(v=>{
    const z=v.zh[0];if(!HAN_RE.test(z))return;
    let chars=[...z],py=v.py[0],fr=v.fr[0];
    if(chars.length===2&&chars[0]===chars[1]){fr=`${fr} (dans ${z})`;py=firstSyl(py,z);chars=[chars[0]]}
    if(!chars.every(hasData))return;
    if(!chars.some(c=>!seen.has(c)))return;
    chars.forEach(c=>seen.add(c));
    out.push({zh:chars.join(""),word:z,chars,py,fr});
  });
  return _wrCache[l.id]=out;
}
const wrChars=l=>[...new Set(wrWords(l).flatMap(w=>w.chars))];
const wrMastered=l=>wrChars(l).filter(c=>wrSt(c)==="m").length;
function wrWordOf(l,c){return wrWords(l).find(w=>w.chars.includes(c))}
const wrWordState=w=>w.chars.every(c=>wrSt(c)==="m")?"m":w.chars.some(c=>wrSt(c)!=="n")?"c":"n";

/* ---------- Petits composants ---------- */
const chip=(c,st,size)=>`<span lang="zh" class="wchip ${st} ${size||""}">${esc(c)}</span>`;
function speak(text){
  try{const u=new SpeechSynthesisUtterance(text);u.lang="zh-CN";u.rate=.8;
    const v=speechSynthesis.getVoices().find(x=>/^zh(-|_)?(CN|Hans)?/i.test(x.lang));if(v)u.voice=v;
    speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
}
const canSpeak=()=>{try{return "speechSynthesis" in window&&typeof SpeechSynthesisUtterance==="function"}catch(e){return false}};

function streakSheet(){

    <p class="note-p">Pour garder la flamme : une série réussie par jour. Un niveau validé à 80 %, un contrôle réussi, une révision notée 10/20 ou plus, ou une série d'écriture avec au moins la moitié des caractères sans faute.</p>`,"Calendrier de la flamme",ov=>{
    const draw=()=>{
      const base=new Date(),m0=new Date(base.getFullYear(),base.getMonth()+off,1),y=m0.getFullYear(),mo=m0.getMonth();
      const first=(m0.getDay()+6)%7,dim=new Date(y,mo+1,0).getDate();
      let cells="";for(let i=0;i<first;i++)cells+=`<span></span>`;
      for(let d=1;d<=dim;d++){
        const n=dayNum(`${y}-${pad(mo+1)}-${pad(d)}`),a=has(n),col=(first+d-1)%7;
        const cls=["cday",a?"a":"",a&&col>0&&has(n-1)?"jl":"",a&&col<6&&d<dim&&has(n+1)?"jr":"",n===t?"t":"",n>t?"f":""].filter(Boolean).join(" ");

        <div class="calg" role="grid" aria-label="${esc(ml)} ${y}">${JS_LET.map(x=>`<span class="dn">${x}</span>`).join("")}${cells}</div>`;
      ov.querySelector("#cprev").onclick=()=>{off--;draw()};
      ov.querySelector("#cnext").onclick=()=>{if(off<0){off++;draw()}};
    };
    draw();
