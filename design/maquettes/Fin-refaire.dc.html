<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fin de niveau, à refaire</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#256E5E}a:hover{color:#1B5246}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F5F3; color: #18221F; font-family: 'Source Sans 3', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px; padding: 16px 16px 30px; box-sizing: border-box">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 28px">
    <span style="width: 72px; height: 72px; border-radius: 50%; background: #F6EBD3; border: 2px solid #9A6A12; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#9A6A12" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4"></path><path d="M3 4v5h5"></path></svg></span>
    <h1 style="margin: 0; font-size: 26px; font-weight: 700">Niveau 3 à refaire</h1>
    <p style="margin: 0; font-size: 15px; color: #5E6C67">Mon, ma, mes et avoir, Production</p>
  </div>

  <section aria-label="Score" style="background: #FFFFFF; border: 1px solid #D3DCD8; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 34px; font-weight: 700; color: #9A6A12; font-variant-numeric: tabular-nums">70 %</span>
      <span style="font-size: 15px; color: #5E6C67">7 sur 10, il en faut 8</span>
    </div>
    <div style="position: relative; height: 26px">
      <div style="position: absolute; left: 0; right: 0; top: 0; height: 10px; border-radius: 5px; background: #F6EBD3; overflow: hidden"><div style="width: 70%; height: 100%; background: #9A6A12; border-radius: 5px"></div></div>
      <div aria-hidden="true" style="position: absolute; left: 80%; top: -3px; width: 2px; height: 16px; background: #18221F"></div>
      <span style="position: absolute; left: 80%; top: 13px; transform: translateX(-50%); font-size: 12px; font-weight: 600; color: #5E6C67; white-space: nowrap">80 % requis</span>
    </div>
  </section>

  <section aria-label="Erreurs" style="background: #FFFFFF; border: 1px solid #D3DCD8; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 0; font-size: 16px; font-weight: 700">3 erreurs, ajoutées à ta révision</h2>
    <sc-for list="{{errs}}" as="e" hint-placeholder-count="3">
      <div style="border-top: 1px solid #D3DCD8; padding-top: 10px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 700">{{e.fr}}</span>
        <span style="font-size: 14px; color: #5E6C67">Ta réponse : <s lang="zh-Latn-pinyin">{{e.mine}}</s></span>
        <span style="font-size: 14px">Réponse : <b lang="zh-Latn-pinyin">{{e.py}}</b> <span lang="zh" style="font-family: 'Noto Serif SC', serif; color: #5E6C67">{{e.zh}}</span></span>
      </div>
    </sc-for>
  </section>

  <div style="flex: 1"></div>
  <a href="Ex-Pinyin.dc.html" style="height: 56px; border-radius: 14px; background: #256E5E; color: #FFFFFF; text-decoration: none; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center">Recommencer le niveau 3</a>
  <a href="Main.dc.html" style="height: 48px; border-radius: 14px; color: #256E5E; text-decoration: none; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center">Retour aux leçons</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      errs: [
        { fr: 'ne pas avoir', mine: 'méiyou', py: 'méiyǒu', zh: '没有' },
        { fr: 'mon, ma, mes', mine: 'wó de', py: 'wǒ de', zh: '我的' },
        { fr: 'avoir', mine: 'yòu', py: 'yǒu', zh: '有' }
      ]
    };
  }
}
</script>
</body>
</html>
