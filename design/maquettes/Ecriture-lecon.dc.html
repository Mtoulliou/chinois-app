<x-dc>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F5F3; color: #18221F; font-family: 'Source Sans 3', system-ui, sans-serif">
  <main style="display: flex; flex-direction: column; gap: 12px; padding: 12px 16px 110px">
    <div style="display: flex; align-items: center; gap: 4px">
      <a href="Ecriture.dc.html" aria-label="Retour à Écriture" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#18221F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #256E5E">Écriture, leçon 4</span>
        <h1 style="margin: 0; font-size: 22px; font-weight: 700; line-height: 1.15">Ma famille</h1>
      </div>
    </div>

    <section aria-label="Progression et série" style="background: #FFFFFF; border: 1px solid #D3DCD8; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 15px; font-weight: 600">Caractères maîtrisés</span>
        <span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">6 / 24</span>
      </div>
      <div style="height: 8px; border-radius: 4px; background: #DCEDE7; overflow: hidden"><div style="width: 25%; height: 100%; background: #256E5E; border-radius: 4px"></div></div>
      <a href="Ecriture-demo.dc.html" style="height: 52px; border-radius: 14px; background: #256E5E; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">Lancer une série de 8</a>
      <span style="font-size: 13px; color: #5E6C67; text-align: center">Priorité aux caractères pas encore maîtrisés</span>
    </section>

    <div role="tablist" aria-label="Filtrer" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: #E7ECEA; border-radius: 12px; padding: 4px">
      <button role="tab" aria-selected="true" style="min-height: 40px; border: 0; border-radius: 9px; background: #FFFFFF; color: #18221F; font-size: 14px; font-weight: 700; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12)">Tous (24)</button>
      <button role="tab" aria-selected="false" style="min-height: 40px; border: 0; border-radius: 9px; background: transparent; color: #3E4C47; font-size: 14px; font-weight: 600">À travailler (18)</button>
      <button role="tab" aria-selected="false" style="min-height: 40px; border: 0; border-radius: 9px; background: transparent; color: #3E4C47; font-size: 14px; font-weight: 600">Maîtrisés (6)</button>
    </div>

    <ul style="list-style: none; margin: 0; padding: 0; background: #FFFFFF; border: 1px solid #D3DCD8; border-radius: 16px; overflow: hidden">
      <sc-for list="{{words}}" as="w" hint-placeholder-count="7">
        <li style="border-top: 1px solid #D3DCD8; margin-top: -1px">
          <a href="Ecriture-demo.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; color: #18221F; text-decoration: none">
            <span style="display: flex; gap: 4px">
              <sc-for list="{{w.chars}}" as="c" hint-placeholder-count="2">
                <sc-if value="{{c.m}}" hint-placeholder-val="{{false}}"><span lang="zh" style="width: 42px; height: 42px; border-radius: 9px; background: #DCEDE7; border: 1.5px solid #256E5E; box-sizing: border-box; color: #256E5E; font-family: 'Noto Serif SC', serif; font-size: 24px; display: flex; align-items: center; justify-content: center">{{c.ch}}</span></sc-if>
                <sc-if value="{{c.c}}" hint-placeholder-val="{{false}}"><span lang="zh" style="width: 42px; height: 42px; border-radius: 9px; background: #FFFFFF; border: 2px solid #256E5E; box-sizing: border-box; color: #18221F; font-family: 'Noto Serif SC', serif; font-size: 24px; display: flex; align-items: center; justify-content: center">{{c.ch}}</span></sc-if>
                <sc-if value="{{c.n}}" hint-placeholder-val="{{true}}"><span lang="zh" style="width: 42px; height: 42px; border-radius: 9px; background: #E7ECEA; color: #5E6C67; font-family: 'Noto Serif SC', serif; font-size: 24px; display: flex; align-items: center; justify-content: center">{{c.ch}}</span></sc-if>
              </sc-for>
            </span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
              <span lang="zh-Latn-pinyin" style="font-size: 16px; font-weight: 700">{{w.py}}</span>
              <span style="font-size: 14px; color: #5E6C67">{{w.fr}}</span>
            </span>
            <span style="font-size: 12px; font-weight: 700; color: #5E6C67; white-space: nowrap">{{w.state}}</span>
          </a>
        </li>
      </sc-for>
    </ul>
  </main>

  <nav aria-label="Navigation principale" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-top: 1px solid #D3DCD8; display: flex; gap: 6px; padding: 8px 12px 26px; box-sizing: border-box">
    <a href="Main.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 12px; color: #5E6C67; text-decoration: none; font-size: 13px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5E6C67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5h6a4 4 0 0 1 4 4v11a3 3 0 0 0-3-3H2z"></path><path d="M22 5h-6a4 4 0 0 0-4 4v11a3 3 0 0 1 3-3h7z"></path></svg>
      Leçons
    </a>    <a href="Revision.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 12px; color: #5E6C67; text-decoration: none; font-size: 13px; font-weight: 600; position: relative">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5E6C67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4"></path><path d="M3 4v5h5"></path></svg>
      Révision
      <span aria-label="7 erreurs à retravailler" style="position: absolute; top: 2px; left: calc(50% + 6px); min-width: 20px; height: 20px; border-radius: 10px; background: #A93434; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 5px; box-sizing: border-box">7</span>
    </a>
    <a href="Ecriture.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 12px; background: #DCEDE7; color: #256E5E; text-decoration: none; font-size: 13px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#256E5E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
      Écriture
    </a>
    <a href="Parametres.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 12px; color: #5E6C67; text-decoration: none; font-size: 13px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5E6C67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9"></path><path d="M17 6h3"></path><circle cx="15" cy="6" r="2"></circle><path d="M4 12h3"></path><path d="M11 12h9"></path><circle cx="9" cy="12" r="2"></circle><path d="M4 18h11"></path><path d="M19 18h1"></path><circle cx="17" cy="18" r="2"></circle></svg>
      Paramètres
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const w = (zh, st, py, fr) => {
      const chars = zh.split('').map((ch, i) => ({ ch, m: st[i] === 'm', c: st[i] === 'c', n: st[i] === 'n' }));
      const state = st.split('').every(s => s === 'm') ? 'Maîtrisé' : st.includes('c') ? 'En cours' : st.includes('m') ? 'En cours' : 'Nouveau';
      return { chars, py, fr, state };
    };
    return {
      words: [
        w('妈', 'c', 'mā', 'maman (dans 妈妈)'),
        w('爸', 'm', 'bà', 'papa (dans 爸爸)'),
        w('哥', 'm', 'gē', 'grand frère (dans 哥哥)'),
        w('姐', 'c', 'jiě', 'grande sœur (dans 姐姐)'),
        w('弟', 'n', 'dì', 'petit frère (dans 弟弟)'),
        w('妹', 'n', 'mèi', 'petite sœur (dans 妹妹)'),
        w('没有', 'nm', 'méiyǒu', 'ne pas avoir'),
        w('这是', 'mm', 'zhè shì', 'voici'),
        w('大家', 'mc', 'dàjiā', 'tout le monde')
      ]
    };
  }
}
</script>
</body>
</html>
