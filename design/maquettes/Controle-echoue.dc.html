<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Contrôle échoué</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#256E5E}a:hover{color:#1B5246}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F5F3; color: #18221F; font-family: 'Source Sans 3', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px; padding: 16px 16px 30px; box-sizing: border-box">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 28px">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #9A6A12">Contrôle, leçon 4</span>
    <p style="margin: 0; font-size: 56px; font-weight: 700; line-height: 1; color: #9A6A12; font-variant-numeric: tabular-nums">13<span style="font-size: 28px; color: #5E6C67"> / 20</span></p>
    <h1 style="margin: 0; font-size: 26px; font-weight: 700">Pas encore validée</h1>
    <p style="margin: 0; font-size: 15px; color: #5E6C67; text-align: center">Il faut 16 / 20. Tes niveaux restent validés.</p>
  </div>

  <section aria-label="Résultat par thème" style="background: #FFFFFF; border: 1px solid #D3DCD8; border-radius: 16px; padding: 6px 16px 0; overflow: hidden">
    <div style="display: flex; flex-direction: column; margin-bottom: -1px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #D3DCD8">
          <span style="flex: 1; display: flex; flex-direction: column">
            <span style="font-size: 15px; font-weight: 600">{{r.name}}</span>
            <sc-if value="{{r.weak}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 700; color: #9A6A12">À revoir</span></sc-if>
          </span>
          <span aria-hidden="true" style="display: flex; gap: 3px">
            <sc-for list="{{r.seg}}" as="s" hint-placeholder-count="5">
              <sc-if value="{{s.ok}}" hint-placeholder-val="{{true}}"><span style="width: 12px; height: 8px; border-radius: 2px; background: #256E5E"></span></sc-if>
              <sc-if value="{{s.weak}}" hint-placeholder-val="{{false}}"><span style="width: 12px; height: 8px; border-radius: 2px; background: #9A6A12"></span></sc-if>
              <sc-if value="{{s.off}}" hint-placeholder-val="{{false}}"><span style="width: 12px; height: 8px; border-radius: 2px; background: #D3DCD8"></span></sc-if>
            </sc-for>
          </span>
          <span style="width: 32px; text-align: right; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">{{r.score}}</span>
        </div>
      </sc-for>
    </div>
  </section>

  <section aria-label="Thèmes à revoir" style="display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 0; font-size: 14px; font-weight: 700; color: #5E6C67">Revoir un thème avant de repasser</h2>
    <sc-for list="{{weak}}" as="w" hint-placeholder-count="3">
      <a href="Theme.dc.html" style="min-height: 48px; background: #FFFFFF; border: 1px solid #D3DCD8; border-radius: 12px; padding: 0 14px; display: flex; align-items: center; gap: 10px; color: #18221F; text-decoration: none">
        <span style="flex: 1; font-size: 15px; font-weight: 600">{{w}}</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E6C67" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
    </sc-for>
  </section>

  <div style="flex: 1"></div>
  <a href="Revision.dc.html" style="height: 56px; border-radius: 14px; background: #256E5E; color: #FFFFFF; text-decoration: none; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center">Réviser mes 7 erreurs</a>
  <a href="Controle-intro.dc.html" style="height: 48px; border-radius: 14px; color: #256E5E; text-decoration: none; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center">Repasser le contrôle</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const mk = (name, n) => {
      const weak = n < 4;
      return {
        name, weak, score: n + '/5',
        seg: [0, 1, 2, 3, 4].map(i => ({ ok: i < n && !weak, weak: i < n && weak, off: i >= n }))
      };
    };
    return {
      rows: [
        mk('Membres de la famille', 5),
        mk('Mon, ma, mes et avoir', 2),
        mk('Compter les personnes', 3),
        mk('Présenter sa famille', 3)
      ],
      weak: ['Mon, ma, mes et avoir', 'Compter les personnes', 'Présenter sa famille']
    };
  }
}
</script>
</body>
</html>
